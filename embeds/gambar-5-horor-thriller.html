<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Distribusi Warna Horor dan Thriller/Misteri</title><style>
:root{--ink:#171714;--muted:#706b63;--paper:#f8f5ef;--panel:#fff;--line:#d8d2c8;--accent:#934734;--shadow:0 18px 48px rgba(40,34,26,.10);--serif:Georgia,"Times New Roman",serif;--sans:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans)}button,input,select{font:inherit}a{color:inherit}.eyebrow{margin:0 0 8px;color:var(--accent);font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase}.visual-title{margin:0;font-family:var(--serif);font-size:clamp(28px,4.2vw,52px);font-weight:400;line-height:1.05;letter-spacing:-.035em}.visual-sub{max-width:760px;margin:10px 0 0;color:var(--muted);font-size:14px;line-height:1.55}.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.control{min-height:42px;border:1px solid var(--line);border-radius:10px;background:#fff;padding:9px 12px}.button{cursor:pointer;border:1px solid var(--ink);border-radius:999px;background:var(--ink);color:#fff;padding:10px 16px;font-size:12px;font-weight:800}.button.ghost{background:#fff;color:var(--ink);border-color:var(--line)}.metric{font-family:var(--serif);font-size:34px;line-height:1}.muted{color:var(--muted)}.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
@media(max-width:680px){.visual-title{font-size:34px}.visual-sub{font-size:13px}.card{border-radius:13px}.toolbar{align-items:stretch}.control{width:100%}.button{min-height:44px}}
body{padding:18px}.wrap{max-width:1180px;margin:auto}.head{margin-bottom:18px}.genre{margin-bottom:25px}.genre:last-child{margin-bottom:0}.genre h2{margin:0 0 9px;font-family:var(--serif);font-size:28px}.stack{display:flex;height:70px;overflow:hidden;border-radius:10px;border:1px solid var(--line)}.seg{display:grid;place-items:center;min-width:2px;font-size:11px;font-weight:800;overflow:hidden}.legend{display:grid;grid-template-columns:repeat(6,1fr);gap:7px;margin-top:10px;font-size:10px}.legend span{display:flex;align-items:center;gap:5px}@media(max-width:680px){body{padding:10px}.stack{height:56px}.legend{grid-template-columns:repeat(3,1fr)}}</style></head><body><main class="wrap"><header class="head"><p class="eyebrow">Gambar 5</p><h1 class="visual-title">Distribusi Warna Horor dan Thriller/Misteri</h1><p class="visual-sub">Perbandingan komposisi warna menunjukkan posisi hitam dan putih di tengah palet gelap kedua genre.</p></header><div id="bars" class="card" style="padding:18px"></div></main><script>const COLORS={"putih": "#f4f1e8", "oranye": "#f47a16", "cokelat": "#7b462b", "biru": "#1477cc", "merah": "#d62828", "pink": "#ee5f96", "hitam": "#171717", "kuning": "#f4c20d", "ungu": "#7042a8", "hijau": "#2f9147", "abu": "#8e969d"};const names=['Horor','Thriller/Misteri'];const tc=h=>{h=h.slice(1);const r=parseInt(h.slice(0,2),16),g=parseInt(h.slice(2,4),16),b=parseInt(h.slice(4,6),16);return (r*299+g*587+b*114)/1000>158?'#171714':'#fff'};fetch('../data/summary.json').then(r=>r.json()).then(S=>{bars.innerHTML=names.map(g=>{const d=S.genres[g].colors,arr=Object.entries(d).sort((a,b)=>b[1]-a[1]);return `<section class="genre"><h2>${g}</h2><div class="stack">${arr.map(([c,v])=>`<div class="seg" title="${c} ${v}%" style="width:${v}%;background:${COLORS[c]};color:${tc(COLORS[c])}">${v>=6?v.toLocaleString('id-ID',{maximumFractionDigits:1})+'%':''}</div>`).join('')}</div><div class="legend">${arr.map(([c,v])=>`<span><i style="width:10px;height:10px;background:${COLORS[c]}"></i>${c} <b>${v.toLocaleString('id-ID',{maximumFractionDigits:1})}%</b></span>`).join('')}</div></section>`}).join('');reportHeight()})

function reportHeight(){try{parent.postMessage({type:'embed-height',height:Math.ceil(document.documentElement.scrollHeight)},'*')}catch(e){}}
addEventListener('load',()=>setTimeout(reportHeight,80));addEventListener('resize',()=>setTimeout(reportHeight,80));new ResizeObserver(()=>reportHeight()).observe(document.body);
</script></body></html>
