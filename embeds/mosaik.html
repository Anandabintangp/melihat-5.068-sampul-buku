<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Gambar 1 | Mosaik Sampul</title>
<link rel="stylesheet" href="../assets/css/figures.css">
</head>
<body class="figure-page">
<figure class="interactive-figure">
  <div class="figure-toolbar">
    <div>
      <p class="figure-kicker">Gambar 1</p>
      <h1>Mosaik Sampul Buku Sastra Indonesia, 2000–2025</h1>
      <p class="figure-deck">Perbesar untuk melihat sampul, seret untuk menjelajah, lalu ketuk satu buku untuk membaca metadata.</p>
    </div>
    <div class="controls" aria-label="Kontrol mosaik">
      <label>Tahun
        <select id="year"><option value="all">Semua tahun</option></select>
      </label>
      <label>Cari buku
        <input id="search" type="search" placeholder="Judul atau penulis" autocomplete="off">
      </label>
      <div class="control-group" aria-label="Kontrol pembesaran">
        <button id="zoomOut" type="button" aria-label="Perkecil">−</button>
        <button id="zoomReadout" type="button" class="control-readout" aria-label="Kembalikan ke tampilan penuh">100%</button>
        <button id="zoomIn" type="button" aria-label="Perbesar">+</button>
        <button id="fit" type="button">Tampilkan semua</button>
      </div>
    </div>
  </div>

  <div class="mosaic-viewport" id="viewport" tabindex="0" aria-label="Mosaik interaktif 5.068 sampul. Gunakan tombol tambah dan kurang untuk memperbesar. Gunakan tombol panah untuk menggeser.">
    <canvas id="mosaic"></canvas>
    <div class="mosaic-hint" id="hint">Perbesar dengan tombol +, roda tetikus, atau gerakan cubit. Seret untuk menggeser.</div>
  </div>
  <div class="status-row">
    <span id="count">Memuat data…</span>
    <span id="renderStatus">Tampilan penuh menggunakan warna dominan. Sampul akan dimuat saat diperbesar.</span>
  </div>

  <article class="book-detail" id="detail" hidden>
    <img id="detailCover" alt="">
    <div>
      <h2 id="detailTitle"></h2>
      <p id="detailAuthor"></p>
      <p id="detailMeta"></p>
      <p id="detailGenres"></p>
    </div>
    <a id="detailLink" href="#" target="_blank" rel="noopener">Buka di Goodreads</a>
  </article>

  <p class="figure-source">Sumber: korpus 5.068 sampul buku. Pada tampilan jauh, warna dominan dipakai sebagai indeks visual. Sampul asli dimuat hanya pada area yang sedang terlihat agar tetap ringan.</p>
</figure>
<script src="../assets/js/figure-common.js"></script>
<script>
(async function(){
  const books=await KF.loadBooks();
  const canvas=document.getElementById('mosaic');
  const ctx=canvas.getContext('2d',{alpha:false});
  const viewport=document.getElementById('viewport');
  const year=document.getElementById('year');
  const search=document.getElementById('search');
  const zoomIn=document.getElementById('zoomIn');
  const zoomOut=document.getElementById('zoomOut');
  const zoomReadout=document.getElementById('zoomReadout');
  const fitButton=document.getElementById('fit');
  const count=document.getElementById('count');
  const renderStatus=document.getElementById('renderStatus');
  const detail=document.getElementById('detail');
  const detailCover=document.getElementById('detailCover');
  const detailTitle=document.getElementById('detailTitle');
  const detailAuthor=document.getElementById('detailAuthor');
  const detailMeta=document.getElementById('detailMeta');
  const detailGenres=document.getElementById('detailGenres');
  const detailLink=document.getElementById('detailLink');

  [...new Set(books.map(b=>b.year).filter(Boolean))].sort((a,b)=>a-b).forEach(y=>year.add(new Option(y,y)));

  const BASE_W=68;
  const BASE_H=102;
  const GAP=4;
  const imageCache=new Map();
  const pointers=new Map();
  let shown=books.slice();
  let cols=1,rows=1,worldW=1,worldH=1;
  let scale=1,minScale=1,maxScale=8;
  let offsetX=0,offsetY=0;
  let selectedIndex=-1;
  let dragging=false;
  let moved=false;
  let lastPointer={x:0,y:0};
  let pinchStart=null;
  let drawQueued=false;

  function recalcWorld(){
    const ratio=Math.max(.6,viewport.clientWidth/Math.max(1,viewport.clientHeight));
    cols=Math.max(1,Math.ceil(Math.sqrt(Math.max(1,shown.length)*ratio*BASE_H/BASE_W)));
    rows=Math.max(1,Math.ceil(Math.max(1,shown.length)/cols));
    worldW=cols*(BASE_W+GAP)-GAP;
    worldH=rows*(BASE_H+GAP)-GAP;
  }

  function clampOffsets(){
    const vw=viewport.clientWidth,vh=viewport.clientHeight;
    const contentW=worldW*scale,contentH=worldH*scale;
    if(contentW<=vw) offsetX=(vw-contentW)/2;
    else offsetX=Math.min(0,Math.max(vw-contentW,offsetX));
    if(contentH<=vh) offsetY=(vh-contentH)/2;
    else offsetY=Math.min(0,Math.max(vh-contentH,offsetY));
  }

  function fit(){
    recalcWorld();
    const pad=12;
    minScale=Math.min((viewport.clientWidth-pad*2)/worldW,(viewport.clientHeight-pad*2)/worldH);
    minScale=Math.max(.035,minScale);
    maxScale=Math.max(minScale*28,3.6);
    scale=minScale;
    offsetX=(viewport.clientWidth-worldW*scale)/2;
    offsetY=(viewport.clientHeight-worldH*scale)/2;
    updateZoomReadout();
    queueDraw();
  }

  function updateZoomReadout(){
    const pct=Math.round(scale/minScale*100);
    zoomReadout.textContent=pct.toLocaleString('id-ID')+'%';
    renderStatus.textContent=(BASE_W*scale>=18)
      ? 'Sampul pada area terlihat sedang dimuat. Ketuk sampul untuk membaca metadata.'
      : 'Tampilan jauh menggunakan warna dominan. Perbesar untuk memuat sampul.';
  }

  function zoomAt(factor,cx=viewport.clientWidth/2,cy=viewport.clientHeight/2){
    const old=scale;
    const next=Math.max(minScale,Math.min(maxScale,scale*factor));
    if(Math.abs(next-old)<.00001) return;
    const wx=(cx-offsetX)/old;
    const wy=(cy-offsetY)/old;
    scale=next;
    offsetX=cx-wx*scale;
    offsetY=cy-wy*scale;
    clampOffsets();
    updateZoomReadout();
    queueDraw();
  }

  function imageEntry(book){
    let entry=imageCache.get(book.image);
    if(entry) return entry;
    const img=new Image();
    img.decoding='async';
    entry={img,state:'loading',triedRemote:false};
    imageCache.set(book.image,entry);
    img.onload=()=>{entry.state='ready';queueDraw();};
    img.onerror=()=>{
      if(!entry.triedRemote){
        entry.triedRemote=true;
        img.src=KF.coverUrl(book.image,true);
      }else{
        entry.state='error';
        queueDraw();
      }
    };
    img.src=KF.coverUrl(book.image,false);
    return entry;
  }

  function queueDraw(){
    if(drawQueued) return;
    drawQueued=true;
    requestAnimationFrame(()=>{drawQueued=false;draw();});
  }

  function draw(){
    const w=viewport.clientWidth,h=viewport.clientHeight,dpr=Math.min(2,window.devicePixelRatio||1);
    canvas.width=Math.max(1,Math.round(w*dpr));
    canvas.height=Math.max(1,Math.round(h*dpr));
    canvas.style.width=w+'px';
    canvas.style.height=h+'px';
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.fillStyle='#ded8ce';
    ctx.fillRect(0,0,w,h);

    const cellW=(BASE_W+GAP)*scale;
    const cellH=(BASE_H+GAP)*scale;
    const firstCol=Math.max(0,Math.floor((-offsetX)/(cellW))-1);
    const lastCol=Math.min(cols-1,Math.ceil((w-offsetX)/(cellW))+1);
    const firstRow=Math.max(0,Math.floor((-offsetY)/(cellH))-1);
    const lastRow=Math.min(rows-1,Math.ceil((h-offsetY)/(cellH))+1);
    const drawImages=BASE_W*scale>=18;
    let visible=0;

    for(let r=firstRow;r<=lastRow;r++){
      for(let c=firstCol;c<=lastCol;c++){
        const i=r*cols+c;
        if(i>=shown.length) continue;
        visible++;
        const b=shown[i];
        const x=offsetX+c*(BASE_W+GAP)*scale;
        const y=offsetY+r*(BASE_H+GAP)*scale;
        const tw=BASE_W*scale,th=BASE_H*scale;
        ctx.fillStyle=KF.colorMap[b.dominant_color]||'#aaa';
        ctx.fillRect(x,y,Math.max(1,tw),Math.max(1,th));

        if(drawImages && visible<260){
          const entry=imageEntry(b);
          if(entry.state==='ready'){
            const iw=entry.img.naturalWidth,ih=entry.img.naturalHeight;
            const ir=iw/ih,tr=BASE_W/BASE_H;
            let sx=0,sy=0,sw=iw,sh=ih;
            if(ir>tr){sw=ih*tr;sx=(iw-sw)/2;}else{sh=iw/tr;sy=(ih-sh)/2;}
            ctx.drawImage(entry.img,sx,sy,sw,sh,x,y,tw,th);
          }
        }

        if(i===selectedIndex){
          ctx.save();
          ctx.strokeStyle='#fff';ctx.lineWidth=Math.max(2,4*Math.min(1,scale));
          ctx.strokeRect(x+1,y+1,Math.max(1,tw-2),Math.max(1,th-2));
          ctx.strokeStyle='#1d1a16';ctx.lineWidth=Math.max(1,2*Math.min(1,scale));
          ctx.strokeRect(x+3,y+3,Math.max(1,tw-6),Math.max(1,th-6));
          ctx.restore();
        }
      }
    }
    count.textContent=`${KF.fmtInt(shown.length)} sampul ditampilkan`;
  }

  function bookAt(clientX,clientY){
    const rect=viewport.getBoundingClientRect();
    const wx=(clientX-rect.left-offsetX)/scale;
    const wy=(clientY-rect.top-offsetY)/scale;
    if(wx<0||wy<0) return null;
    const c=Math.floor(wx/(BASE_W+GAP));
    const r=Math.floor(wy/(BASE_H+GAP));
    const localX=wx-c*(BASE_W+GAP),localY=wy-r*(BASE_H+GAP);
    if(localX>BASE_W||localY>BASE_H) return null;
    const i=r*cols+c;
    if(i<0||i>=shown.length) return null;
    return {book:shown[i],index:i};
  }

  function selectBook(hit){
    if(!hit) return;
    selectedIndex=hit.index;
    const b=hit.book;
    detail.hidden=false;
    detailTitle.textContent=b.title||'Judul tidak tercatat';
    detailAuthor.textContent=b.author||'Penulis tidak tercatat';
    detailMeta.textContent=`${b.year||'Tahun tidak tercatat'} · Rating ${b.rating ? KF.fmt(b.rating,2) : 'tidak tercatat'} · ${b.typeface||'Type­face tidak tercatat'}`;
    detailGenres.textContent=(b.genres||[]).slice(0,6).join(' · ')||'Genre tidak tercatat';
    detailCover.alt=`Sampul ${b.title||'buku terpilih'}`;
    detailCover.dataset.remoteTried='';
    KF.setCoverFallback(detailCover,b.image);
    detailLink.href=b.url||'#';
    detailLink.hidden=!b.url;
    queueDraw();
    KF.announceHeight();
  }

  function applyFilter(){
    const q=search.value.trim().toLocaleLowerCase('id-ID');
    const yv=year.value;
    shown=books.filter(b=>(yv==='all'||String(b.year)===yv)&&(!q||`${b.title||''} ${b.author||''}`.toLocaleLowerCase('id-ID').includes(q)));
    selectedIndex=-1;
    detail.hidden=true;
    fit();
  }

  function pointerPosition(e){
    const rect=viewport.getBoundingClientRect();
    return {x:e.clientX-rect.left,y:e.clientY-rect.top};
  }

  viewport.addEventListener('pointerdown',e=>{
    viewport.setPointerCapture(e.pointerId);
    pointers.set(e.pointerId,pointerPosition(e));
    moved=false;
    if(pointers.size===1){
      dragging=true;
      viewport.classList.add('is-dragging');
      lastPointer=pointerPosition(e);
    }else if(pointers.size===2){
      const ps=[...pointers.values()];
      pinchStart={distance:Math.hypot(ps[0].x-ps[1].x,ps[0].y-ps[1].y),scale,center:{x:(ps[0].x+ps[1].x)/2,y:(ps[0].y+ps[1].y)/2}};
    }
  });

  viewport.addEventListener('pointermove',e=>{
    if(!pointers.has(e.pointerId)) return;
    const pos=pointerPosition(e);
    pointers.set(e.pointerId,pos);
    if(pointers.size===2 && pinchStart){
      const ps=[...pointers.values()];
      const distance=Math.hypot(ps[0].x-ps[1].x,ps[0].y-ps[1].y);
      const center={x:(ps[0].x+ps[1].x)/2,y:(ps[0].y+ps[1].y)/2};
      const desired=pinchStart.scale*(distance/Math.max(1,pinchStart.distance));
      zoomAt(desired/scale,center.x,center.y);
      moved=true;
      return;
    }
    if(dragging && pointers.size===1){
      const dx=pos.x-lastPointer.x,dy=pos.y-lastPointer.y;
      if(Math.abs(dx)+Math.abs(dy)>2) moved=true;
      offsetX+=dx;offsetY+=dy;lastPointer=pos;
      clampOffsets();queueDraw();
    }
  });

  function endPointer(e){
    const wasMoved=moved;
    pointers.delete(e.pointerId);
    if(pointers.size<2) pinchStart=null;
    if(pointers.size===0){
      dragging=false;
      viewport.classList.remove('is-dragging');
      if(!wasMoved) selectBook(bookAt(e.clientX,e.clientY));
    }else if(pointers.size===1){
      lastPointer=[...pointers.values()][0];
    }
  }
  viewport.addEventListener('pointerup',endPointer);
  viewport.addEventListener('pointercancel',endPointer);

  viewport.addEventListener('wheel',e=>{
    e.preventDefault();
    const rect=viewport.getBoundingClientRect();
    zoomAt(e.deltaY<0?1.18:1/1.18,e.clientX-rect.left,e.clientY-rect.top);
  },{passive:false});

  viewport.addEventListener('keydown',e=>{
    const step=e.shiftKey?120:50;
    if(e.key==='ArrowLeft') offsetX+=step;
    else if(e.key==='ArrowRight') offsetX-=step;
    else if(e.key==='ArrowUp') offsetY+=step;
    else if(e.key==='ArrowDown') offsetY-=step;
    else if(e.key==='+'||e.key==='=') return zoomAt(1.3);
    else if(e.key==='-') return zoomAt(1/1.3);
    else if(e.key==='0') return fit();
    else return;
    e.preventDefault();clampOffsets();queueDraw();
  });

  zoomIn.addEventListener('click',()=>zoomAt(1.35));
  zoomOut.addEventListener('click',()=>zoomAt(1/1.35));
  zoomReadout.addEventListener('click',fit);
  fitButton.addEventListener('click',fit);
  year.addEventListener('change',applyFilter);
  search.addEventListener('input',applyFilter);
  window.addEventListener('resize',fit,{passive:true});

  fit();
})().catch(error=>{
  document.getElementById('viewport').innerHTML='<p style="padding:20px">Visual gagal dimuat: '+error.message+'</p>';
});
</script>
</body>
</html>
