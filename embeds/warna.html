<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gambar 4 | Peta Panas Warna</title><link rel="stylesheet" href="../assets/css/style.css"><link rel="stylesheet" href="../assets/css/figures.css"></head><body class="figure-page"><figure class="interactive-figure"><div class="figure-toolbar"><div><p class="figure-kicker">Gambar 4</p><h1>Peta Panas Distribusi Warna Sampul Buku</h1><p class="figure-deck">Pilih genre untuk menyorot satu baris. Arahkan penunjuk pada sel untuk membaca nilai persis.</p></div><div class="controls"><select id="genre"><option value="">Semua genre</option></select></div></div><div class="chart-host" id="chart"></div><p class="figure-source">Proporsi dihitung dari lima klaster warna K-Means setiap sampul dan dirata-ratakan pada genre terpilih.</p></figure><script src="../assets/js/charts.js"></script><script src="../assets/js/figure-common.js"></script><script>KF.loadSummary().then(s=>{const sel=document.getElementById('genre');s.orders.genres.forEach(g=>sel.add(new Option(g,g)));function draw(){KartografiCharts.drawHeatmap('chart',s,'colors',sel.value?[sel.value]:[])}sel.onchange=draw;draw()}).catch(e=>chart.textContent=e.message);</script></body></html>
