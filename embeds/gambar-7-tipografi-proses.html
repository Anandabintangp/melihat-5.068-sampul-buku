<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gambar 7 | Proses Tipografi</title><link rel="stylesheet" href="../assets/css/figures.css"></head><body class="figure-page"><figure class="interactive-figure"><div class="figure-toolbar"><div><p class="figure-kicker">Gambar 7</p><h1>Proses Analisis Tipografi Sampul Buku</h1><p class="figure-deck">Pilih contoh lain, lalu telusuri tahapan dari gambar sampul sampai kategori typeface.</p></div><div class="controls"><button id="random">Contoh lain</button></div></div><div class="method-stage"><img class="sample-cover" id="cover" alt="Contoh sampul"><div><div class="method-steps" id="steps"></div><div class="result-box" id="result"></div></div></div><p class="figure-source">Visual ini menjelaskan alur analisis. Prediksi font pada satu sampul tetap perlu dibaca bersama nilai confidence dan penanda audit.</p></figure><script src="../assets/js/figure-common.js"></script><script>
KF.loadBooks().then(books=>{const usable=books.filter(b=>b.image&&b.font&&b.typeface),cover=document.getElementById('cover'),steps=document.getElementById('steps'),result=document.getElementById('result');let b;const names=[['1. Deteksi teks','EasyOCR mencari wilayah yang diperkirakan memuat judul dan nama penulis.'],['2. Verifikasi judul','Hasil OCR dibandingkan dengan metadata melalui fuzzy string matching.'],['3. Pencocokan visual','Potongan teks dibandingkan dengan contoh font dalam basis data menggunakan CLIP.'],['4. Klasifikasi','Prediksi font dipetakan ke Serif, Script, Sans-serif, atau Fancy.']];function activate(i){[...steps.children].forEach((x,j)=>x.classList.toggle('active',i===j));const extra=i===0?`Teks sasaran: “${b.title}”`:i===1?`Metadata pembanding: ${b.title} oleh ${b.author}`:i===2?`Prediksi teratas: ${b.font}`:`Hasil akhir: ${b.typeface}`;result.innerHTML=`<b>${names[i][0]}</b><p>${names[i][1]} ${extra}.</p>`}function pick(){b=usable[Math.floor(Math.random()*usable.length)];KF.setCoverFallback(cover,b.image);steps.innerHTML='';names.forEach((s,i)=>{const x=document.createElement('button');x.type='button';x.className='method-step';x.innerHTML=`<strong>${s[0]}</strong><span>${s[1]}</span>`;x.onclick=()=>activate(i);steps.appendChild(x)});activate(0)}document.getElementById('random').onclick=pick;pick()}).catch(e=>document.getElementById('result').textContent=e.message);
</script></body></html>
