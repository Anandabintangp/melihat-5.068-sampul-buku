<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gambar 7 Proses Analisis Tipografi</title><style>
:root{--paper:#f6f2e9;--panel:#fff;--ink:#181612;--muted:#706960;--line:#d8d1c6;--accent:#934734;--accent2:#c46a4a;--serif:Georgia,"Iowan Old Style","Times New Roman",serif;--sans:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;--shadow:0 18px 45px rgba(35,28,20,.10)}
*{box-sizing:border-box}html,body{margin:0;color:var(--ink);background:var(--paper);font-family:var(--sans);text-rendering:optimizeLegibility;-webkit-font-smoothing:antialiased}button,input,select{font:inherit}button{cursor:pointer}a{color:inherit}.eyebrow{margin:0 0 7px;color:var(--accent);font-size:11px;font-weight:850;letter-spacing:.14em;text-transform:uppercase}.title{margin:0;font-family:var(--serif);font-size:clamp(27px,4vw,48px);font-weight:400;line-height:1.04;letter-spacing:-.035em}.sub{margin:8px 0 0;color:var(--muted);font-size:13px;line-height:1.5}.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}.control{min-height:40px;border:1px solid var(--line);border-radius:10px;background:#fff;padding:8px 11px;color:var(--ink)}.pill{min-height:36px;border:1px solid var(--line);border-radius:999px;background:#fff;padding:7px 13px;color:var(--muted);font-size:12px;font-weight:800}.pill.active,.pill:hover{border-color:var(--ink);background:var(--ink);color:#fff}.cluster-tabs{display:flex;gap:6px;overflow:auto;scrollbar-width:none}.cluster-tabs::-webkit-scrollbar{display:none}.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.embed-shell{height:100vh;min-height:0;display:grid;grid-template-rows:auto minmax(0,1fr) auto;padding:14px;gap:10px;overflow:hidden}.embed-main{min-height:0;overflow:hidden}.embed-foot{padding-top:7px;border-top:1px solid var(--line);color:var(--muted);font-size:10.5px;line-height:1.35}.mobile-only{display:none}
@media(max-width:760px){html,body{height:auto;overflow:visible}.embed-shell{height:auto;min-height:0;padding:10px;overflow:visible}.embed-main{overflow:visible}.title{font-size:32px}.sub{font-size:12px}.card{border-radius:13px}.control{width:100%}.mobile-only{display:block}}

.stage{height:100%;min-height:0;display:grid;grid-template-rows:minmax(0,1fr) auto;gap:9px}.image-box{position:relative;min-height:0;overflow:hidden;border:1px solid var(--line);background:#fff;touch-action:none}.diagram{position:absolute;left:50%;top:50%;width:100%;height:100%;object-fit:contain;transform:translate(-50%,-50%) scale(var(--zoom,1));transform-origin:center;transition:transform .2s ease}.highlight{position:absolute;top:1.5%;bottom:11%;left:var(--x);width:var(--w);border:3px solid rgba(147,71,52,.9);background:rgba(147,71,52,.06);pointer-events:none;transition:.25s ease}.tools{display:flex;gap:6px;align-items:center;justify-content:space-between;flex-wrap:wrap}.steps{display:flex;gap:5px;overflow-x:auto;scrollbar-width:none}.steps::-webkit-scrollbar{display:none}.zoom{display:flex;gap:5px}.detail{margin:0;color:var(--muted);font-size:11px;line-height:1.4}@media(max-width:760px){.image-box{height:56vw;min-height:250px}.highlight{bottom:9%}.tools{align-items:stretch}.zoom{margin-left:auto}}
</style></head><body><main class="embed-shell"><header><p class="eyebrow">Gambar 7</p><h1 class="title">Proses analisis tipografi sampul</h1><p class="sub">Diagram asli dalam naskah menggunakan sampul <em>Hujan</em> karya Tere Liye. Pilih tahap untuk menyorot bagian analisis, atau perbesar untuk membaca rinciannya.</p></header><section class="embed-main stage"><div class="image-box" id="box"><img class="diagram" id="diagram" src="../assets/figures/gambar-7-tipografi-word.png" alt="Lima tahap analisis tipografi sampul Hujan karya Tere Liye"><div class="highlight" id="highlight"></div></div><div><div class="tools"><div class="steps" id="steps"><button class="pill active" data-i="0">1 Input</button><button class="pill" data-i="1">2 Deteksi</button><button class="pill" data-i="2">3 Pengenalan</button><button class="pill" data-i="3">4 Ekstraksi</button><button class="pill" data-i="4">5 Analisis</button></div><div class="zoom"><button class="pill" id="minus">−</button><button class="pill" id="reset">100%</button><button class="pill" id="plus">+</button></div></div><p class="detail" id="detail"></p></div></section><footer class="embed-foot">Input sampul dan metadata → EasyOCR → confidence → fuzzy matching → CLIP dan pencocokan font.</footer></main><script>
const steps=document.getElementById('steps'),highlight=document.getElementById('highlight'),detail=document.getElementById('detail'),diagram=document.getElementById('diagram'),minus=document.getElementById('minus'),plus=document.getElementById('plus'),reset=document.getElementById('reset');const data=[['1,0%','19.1%','Sampul dan metadata judul/penulis menjadi input awal.'],['20.0%','19.1%','EasyOCR mendeteksi area teks “HUJAN” dan “Tere Liye”.'],['40.0%','17.1%','Teks dikenali dengan confidence 0,96 dan 0,93.'],['57.5%','20.2%','Kandidat judul dibandingkan dengan metadata menggunakan edit distance.'],['77.8%','21.0%','CLIP dan font matching mengklasifikasikan persona tipografi.']];let zoom=1;function select(i){steps.querySelectorAll('button').forEach((b,j)=>b.classList.toggle('active',i===j));highlight.style.setProperty('--x',data[i][0]);highlight.style.setProperty('--w',data[i][1]);detail.textContent=data[i][2]}steps.onclick=e=>{const b=e.target.closest('button');if(b)select(+b.dataset.i)};function apply(){diagram.style.setProperty('--zoom',zoom);reset.textContent=Math.round(zoom*100)+'%'};minus.onclick=()=>{zoom=Math.max(.75,zoom-.15);apply()};plus.onclick=()=>{zoom=Math.min(2.1,zoom+.15);apply()};reset.onclick=()=>{zoom=1;apply()};select(0);apply();
function reportHeight(){try{const h=Math.ceil(document.documentElement.scrollHeight);parent.postMessage({type:'kartografi-embed-height',height:h},'*');parent.postMessage({type:'embed-height',height:h},'*')}catch(e){}}
addEventListener('load',reportHeight);addEventListener('resize',reportHeight);

</script></body></html>
