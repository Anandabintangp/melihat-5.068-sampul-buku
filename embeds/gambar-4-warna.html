<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gambar 4 | Peta Panas Warna</title><style>
:root{--paper:#f5f1e8;--ink:#1b1915;--muted:#6e675d;--rule:rgba(27,25,21,.18);--accent:#934633;--sans:Inter,Arial,"Helvetica Neue",sans-serif;--serif:Georgia,"Times New Roman",serif}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--paper);color:var(--ink)}body{font-family:var(--sans);text-rendering:optimizeLegibility;-webkit-font-smoothing:antialiased}
.app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto;padding:clamp(12px,1.6vw,22px);gap:clamp(9px,1.1vw,14px)}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;min-width:0}.kicker{margin:0 0 5px;color:var(--accent);font-size:11px;font-weight:850;letter-spacing:.14em;text-transform:uppercase}.head h1{margin:0;font-family:var(--serif);font-size:clamp(25px,3.1vw,46px);font-weight:400;line-height:1.02;letter-spacing:-.035em}.deck{margin:6px 0 0;color:var(--muted);font-size:clamp(11px,1.05vw,14px);line-height:1.42}.source{margin:0;padding-top:8px;border-top:1px solid var(--rule);color:var(--muted);font-size:10.5px;line-height:1.35}
.controls{display:flex;align-items:end;gap:8px;flex-wrap:wrap;justify-content:flex-end}.controls label{display:grid;gap:4px;color:var(--muted);font-size:10px;font-weight:750}.controls select,.controls input,.controls button,.tab{min-height:36px;border:1px solid var(--rule);background:#fbf9f4;color:var(--ink);padding:7px 10px;font:700 12px var(--sans)}.controls button,.tab{cursor:pointer}.controls button:hover,.tab[aria-pressed=true]{border-color:var(--accent);color:var(--accent)}
.panel{min-width:0;min-height:0;border:1px solid var(--rule);background:#fbf9f4;overflow:hidden}.tabs{display:flex;gap:6px}.tab{border-radius:999px;padding-inline:14px}
@media(max-width:680px){.app{padding:10px;gap:8px}.head{align-items:flex-start;flex-direction:column}.controls{width:100%;justify-content:flex-start}.head h1{font-size:27px}.source{font-size:9.5px}}

.app{grid-template-rows:auto minmax(0,1fr) auto}.heat{display:grid;grid-template-columns:130px repeat(11,minmax(42px,1fr));grid-auto-rows:minmax(23px,1fr);min-height:0;font-size:10px}.cell,.label{display:grid;place-items:center;border-right:1px solid rgba(255,255,255,.7);border-bottom:1px solid rgba(255,255,255,.7);min-width:0}.label{justify-items:start;padding-left:8px;background:#f3efe7;font-weight:750;white-space:nowrap}.header{font-size:9px;font-weight:800;writing-mode:vertical-rl;transform:rotate(180deg);padding:5px 0;cursor:pointer}.cell{font-weight:750;cursor:pointer;transition:transform .12s ease,filter .12s ease}.cell:hover,.cell.active{transform:scale(1.08);z-index:3;outline:2px solid #fff;filter:saturate(1.2)}.legend{display:flex;gap:10px;align-items:center}@media(max-width:700px){.heat{grid-template-columns:94px repeat(11,minmax(34px,1fr));font-size:8px;overflow:hidden}.label{padding-left:4px;font-size:8px}.header{font-size:8px}}</style></head><body><main class="app"><header class="head"><div><p class="kicker">Gambar 4</p><h1>Peta panas distribusi warna</h1><p class="deck">Warna sel mengikuti kategori yang dianalisis. Klik sel atau judul warna untuk menyorot pola.</p></div><div class="controls"><label>Genre<select id="genre"><option value="all">Semua genre</option></select></label></div></header><section class="panel heat" id="heat"></section><footer class="source" id="note">Proporsi lima klaster K-Means yang dirata-ratakan pada setiap genre.</footer></main><script>
function reportHeight(){try{parent.postMessage({type:'kartografi-embed-height',height:Math.ceil(document.documentElement.scrollHeight)},'*')}catch(e){}}
addEventListener('load',reportHeight);addEventListener('resize',reportHeight,{passive:true});if('ResizeObserver'in window)new ResizeObserver(reportHeight).observe(document.body);
const fmt=n=>Number(n||0).toLocaleString('id-ID',{maximumFractionDigits:1});
const cmap={'putih':'#f1eee7','oranye':'#e88738','cokelat':'#81563c','biru':'#4e82af','merah':'#c94c43','pink':'#d97896','hitam':'#292826','kuning':'#e8cb52','ungu':'#8266a2','hijau':'#5f8e68','abu':'#92928d'};(async()=>{const s=await fetch('../data/summary.json').then(r=>r.json()),genres=s.orders.genres,colors=s.orders.colors;genres.forEach(g=>genre.add(new Option(g,g)));function textColor(hex){const x=parseInt(hex.slice(1),16),r=x>>16,g=(x>>8)&255,b=x&255;return .299*r+.587*g+.114*b>155?'#201e1a':'#fff'}function draw(){const gs=genre.value==='all'?genres:[genre.value];heat.innerHTML='<div class="label"></div>';colors.forEach(c=>{const h=document.createElement('button');h.className='cell header';h.textContent=c;h.style.background=cmap[c];h.style.color=textColor(cmap[c]);h.onclick=()=>document.querySelectorAll(`[data-color="${c}"]`).forEach(x=>x.classList.toggle('active'));heat.append(h)});gs.forEach(g=>{const l=document.createElement('div');l.className='label';l.textContent=g;heat.append(l);colors.forEach(c=>{const v=s.genres[g].colors[c]||0,base=cmap[c],el=document.createElement('button');el.className='cell';el.dataset.color=c;el.style.background=`color-mix(in srgb, ${base} ${Math.min(100,38+v*1.7)}%, white)`;el.style.color=textColor(base);el.textContent=fmt(v);el.title=`${g} · ${c}: ${fmt(v)}%`;el.onclick=()=>{note.textContent=el.title;document.querySelectorAll('.cell').forEach(x=>x.classList.remove('active'));el.classList.add('active')};heat.append(el)})});reportHeight()}genre.onchange=draw;draw()})();</script></body></html>
