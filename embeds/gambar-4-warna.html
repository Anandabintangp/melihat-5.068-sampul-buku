<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Peta Panas Distribusi Warna Sampul Buku</title><style>
:root{--ink:#171714;--muted:#706b63;--paper:#f8f5ef;--panel:#fff;--line:#d8d2c8;--accent:#934734;--shadow:0 18px 48px rgba(40,34,26,.10);--serif:Georgia,"Times New Roman",serif;--sans:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans)}button,input,select{font:inherit}a{color:inherit}.eyebrow{margin:0 0 8px;color:var(--accent);font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase}.visual-title{margin:0;font-family:var(--serif);font-size:clamp(28px,4.2vw,52px);font-weight:400;line-height:1.05;letter-spacing:-.035em}.visual-sub{max-width:760px;margin:10px 0 0;color:var(--muted);font-size:14px;line-height:1.55}.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.control{min-height:42px;border:1px solid var(--line);border-radius:10px;background:#fff;padding:9px 12px}.button{cursor:pointer;border:1px solid var(--ink);border-radius:999px;background:var(--ink);color:#fff;padding:10px 16px;font-size:12px;font-weight:800}.button.ghost{background:#fff;color:var(--ink);border-color:var(--line)}.metric{font-family:var(--serif);font-size:34px;line-height:1}.muted{color:var(--muted)}.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
@media(max-width:680px){.visual-title{font-size:34px}.visual-sub{font-size:13px}.card{border-radius:13px}.toolbar{align-items:stretch}.control{width:100%}.button{min-height:44px}}
body{padding:18px}.wrap{max-width:1180px;margin:auto}.head{margin-bottom:18px}.heat{display:grid;grid-template-columns:minmax(120px,1.4fr) repeat(11,minmax(58px,1fr));min-width:850px}.cell{min-height:43px;border-right:1px solid #fff;border-bottom:1px solid #fff;display:flex;align-items:center;justify-content:center;padding:5px;font-size:11px;font-weight:750;cursor:pointer}.cell.label{justify-content:flex-start;background:#f2eee7;color:var(--ink);position:sticky;left:0;z-index:2}.cell.head{writing-mode:vertical-rl;transform:rotate(180deg);height:82px;background:#f2eee7;color:var(--ink);font-weight:800}.detail{margin-top:12px;padding:14px;font-size:13px}.cluster{border-top:3px solid #fff}@media(max-width:680px){body{padding:10px}.heat{min-width:760px}.cell{min-height:39px;font-size:10px}.detail{font-size:12px}}</style></head><body><main class="wrap"><header class="head"><p class="eyebrow">Gambar 4</p><h1 class="visual-title">Peta Panas Distribusi Warna Sampul Buku</h1><p class="visual-sub">Pilih klaster, urutkan berdasarkan warna, lalu tekan sel untuk membaca proporsi yang dihitung dari snapshot data publikasi.</p></header><div class="toolbar" style="margin-bottom:14px"><select id="group" class="control"><option value="all">Semua genre</option><option value="bentuk">Klaster K1</option><option value="populer">Klaster K2</option><option value="mode">Klaster K3</option></select><select id="sort" class="control"><option value="">Urutan klaster</option></select></div><div class="card" style="padding:15px;overflow:auto"><div id="heat" class="heat"></div></div><div id="detail" class="card detail">Pilih sel untuk membaca nilai.</div></main><script>const COLORS={"putih": "#f4f1e8", "oranye": "#f47a16", "cokelat": "#7b462b", "biru": "#1477cc", "merah": "#d62828", "pink": "#ee5f96", "hitam": "#171717", "kuning": "#f4c20d", "ungu": "#7042a8", "hijau": "#2f9147", "abu": "#8e969d"};let S;const textColor=h=>{h=h.slice(1);const r=parseInt(h.slice(0,2),16),g=parseInt(h.slice(2,4),16),b=parseInt(h.slice(4,6),16);return (r*299+g*587+b*114)/1000>158?'#171714':'#fff'};function render(){let genres=group.value==='all'?S.orders.genres:S.groups[group.value];const key=sort.value;if(key)genres=[...genres].sort((a,b)=>S.genres[b].colors[key]-S.genres[a].colors[key]);heat.innerHTML='<div class="cell head label">Genre</div>'+S.orders.colors.map(c=>`<div class="cell head" style="background:${COLORS[c]};color:${textColor(COLORS[c])}">${c}</div>`).join('');genres.forEach((g,gi)=>{heat.insertAdjacentHTML('beforeend',`<div class="cell label ${gi&&S.groups.populer.includes(g)&&!S.groups.populer.includes(genres[gi-1])?'cluster':''}">${g}</div>`);S.orders.colors.forEach(c=>{const v=S.genres[g].colors[c],alpha=.16+.84*Math.min(1,v/40),base=COLORS[c];const el=document.createElement('button');el.className='cell';el.style.border='0';el.style.background=`color-mix(in srgb, ${base} ${alpha*100}%, white)`;el.style.color=v>22?textColor(base):'#171714';el.textContent=v.toLocaleString('id-ID',{minimumFractionDigits:1,maximumFractionDigits:1})+'%';el.onclick=()=>detail.innerHTML=`<b>${g}</b> · ${c}: <strong>${el.textContent}</strong>`;heat.append(el)})});reportHeight()}fetch('../data/summary.json').then(r=>r.json()).then(s=>{S=s;S.orders.colors.forEach(c=>sort.add(new Option('Urutkan: '+c,c)));group.onchange=render;sort.onchange=render;render()})

function reportHeight(){try{parent.postMessage({type:'embed-height',height:Math.ceil(document.documentElement.scrollHeight)},'*')}catch(e){}}
addEventListener('load',()=>setTimeout(reportHeight,80));addEventListener('resize',()=>setTimeout(reportHeight,80));new ResizeObserver(()=>reportHeight()).observe(document.body);
</script></body></html>
