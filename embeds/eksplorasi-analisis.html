<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gambar 3 | Eksplorasi Analisis</title><style>
:root{--paper:#f5f1e8;--ink:#1b1915;--muted:#6e675d;--rule:rgba(27,25,21,.18);--accent:#934633;--sans:Inter,Arial,"Helvetica Neue",sans-serif;--serif:Georgia,"Times New Roman",serif}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--paper);color:var(--ink)}body{font-family:var(--sans);text-rendering:optimizeLegibility;-webkit-font-smoothing:antialiased}
.app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto;padding:clamp(12px,1.6vw,22px);gap:clamp(9px,1.1vw,14px)}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;min-width:0}.kicker{margin:0 0 5px;color:var(--accent);font-size:11px;font-weight:850;letter-spacing:.14em;text-transform:uppercase}.head h1{margin:0;font-family:var(--serif);font-size:clamp(25px,3.1vw,46px);font-weight:400;line-height:1.02;letter-spacing:-.035em}.deck{margin:6px 0 0;color:var(--muted);font-size:clamp(11px,1.05vw,14px);line-height:1.42}.source{margin:0;padding-top:8px;border-top:1px solid var(--rule);color:var(--muted);font-size:10.5px;line-height:1.35}
.controls{display:flex;align-items:end;gap:8px;flex-wrap:wrap;justify-content:flex-end}.controls label{display:grid;gap:4px;color:var(--muted);font-size:10px;font-weight:750}.controls select,.controls input,.controls button,.tab{min-height:36px;border:1px solid var(--rule);background:#fbf9f4;color:var(--ink);padding:7px 10px;font:700 12px var(--sans)}.controls button,.tab{cursor:pointer}.controls button:hover,.tab[aria-pressed=true]{border-color:var(--accent);color:var(--accent)}
.panel{min-width:0;min-height:0;border:1px solid var(--rule);background:#fbf9f4;overflow:hidden}.tabs{display:flex;gap:6px}.tab{border-radius:999px;padding-inline:14px}
@media(max-width:680px){.app{padding:10px;gap:8px}.head{align-items:flex-start;flex-direction:column}.controls{width:100%;justify-content:flex-start}.head h1{font-size:27px}.source{font-size:9.5px}}

.app{grid-template-rows:auto auto minmax(0,1fr) auto}.top{display:flex;justify-content:space-between;gap:12px;align-items:end}.explore{display:grid;grid-template-columns:minmax(180px,.42fr) minmax(0,1.58fr);min-height:0}.summary{padding:14px;border-right:1px solid var(--rule);display:grid;grid-template-rows:auto 1fr;gap:10px}.metric strong{display:block;font:400 clamp(28px,3.2vw,48px)/1 var(--serif)}.metric span{color:var(--muted);font-size:10px}.samples{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;align-content:end}.samples img{width:100%;aspect-ratio:2/3;object-fit:cover;background:#ddd}.chart{padding:12px;min-width:0;overflow:hidden}.bars{height:100%;display:grid;align-content:center;gap:6px}.bar{display:grid;grid-template-columns:minmax(90px,150px) minmax(0,1fr) 54px;align-items:center;gap:8px;font-size:11px;cursor:pointer}.track{height:18px;background:#e7e2d9;overflow:hidden}.fill{height:100%;background:var(--accent);transition:width .35s ease}.bar:hover .fill,.bar.active .fill{filter:saturate(1.3);box-shadow:inset 0 0 0 2px rgba(0,0,0,.18)}.bar b{text-align:right}@media(max-width:700px){.explore{grid-template-columns:1fr}.summary{display:none}.bar{grid-template-columns:92px 1fr 42px}}</style></head><body><main class="app"><header class="head"><div><p class="kicker">Gambar 3</p><h1>Eksplorasi analisis visual sampul</h1><p class="deck">Jelajahi genre, warna, tipografi, dan ilustrasi dalam satu ruang interaktif.</p></div><div class="controls"><label>Tahun<select id="year"><option value="all">2000–2025</option></select></label></div></header><nav class="tabs" aria-label="Jenis analisis"><button class="tab" data-mode="genre" aria-pressed="true">Genre</button><button class="tab" data-mode="color">Warna</button><button class="tab" data-mode="typeface">Tipografi</button><button class="tab" data-mode="illustration">Ilustrasi</button></nav><section class="panel explore"><aside class="summary"><div class="metric"><strong id="n">5.068</strong><span>sampul pada pilihan aktif</span></div><div class="samples" id="samples"></div></aside><div class="chart"><div class="bars" id="bars"></div></div></section><footer class="source">Klik satu batang untuk melihat contoh sampul. Data dibaca langsung dari korpus yang sama dengan esai.</footer></main><script>
function reportHeight(){try{parent.postMessage({type:'kartografi-embed-height',height:Math.ceil(document.documentElement.scrollHeight)},'*')}catch(e){}}
addEventListener('load',reportHeight);addEventListener('resize',reportHeight,{passive:true});if('ResizeObserver'in window)new ResizeObserver(reportHeight).observe(document.body);
const fmt=n=>Number(n||0).toLocaleString('id-ID',{maximumFractionDigits:1});

(async()=>{const books=await fetch('../data/books.min.json').then(r=>r.json()),year=document.getElementById('year');[...new Set(books.map(b=>b.year).filter(Boolean))].sort().forEach(y=>year.add(new Option(y,y)));let mode='genre',selected='';const colorHex={putih:'#e9e5dc',oranye:'#dd7a2f',cokelat:'#795038',biru:'#477aa7',merah:'#c3483f',pink:'#d67891',hitam:'#242321',kuning:'#e7c94d',ungu:'#8264a2',hijau:'#5d8b63',abu:'#8c8c87'};function filtered(){return year.value==='all'?books:books.filter(b=>String(b.year)===year.value)}function aggregate(list){const m=new Map();list.forEach(b=>{let vals=[];if(mode==='genre')vals=b.genres||[];if(mode==='color')vals=[b.dominant_color];if(mode==='typeface')vals=[b.typeface];if(mode==='illustration')vals=[b.illustration];vals.filter(Boolean).forEach(v=>m.set(v,(m.get(v)||0)+1))});return [...m].sort((a,b)=>b[1]-a[1]).slice(0,12)}function coverUrl(b,remote=false){return remote?'https://raw.githubusercontent.com/risethumdigsasindo/Kartografi-Sampul-Sastra-Indonesia/main/covers/'+encodeURIComponent(b.image):'../assets/covers/'+encodeURIComponent(b.image)}function drawSamples(list,key){const pool=list.filter(b=>mode==='genre'?(b.genres||[]).includes(key):mode==='color'?b.dominant_color===key:mode==='typeface'?b.typeface===key:b.illustration===key).slice(0,6);samples.innerHTML='';pool.forEach(b=>{const im=new Image();im.alt=b.title;im.src=coverUrl(b);im.onerror=()=>{if(!im.dataset.r){im.dataset.r=1;im.src=coverUrl(b,true)}};samples.append(im)})}function draw(){const list=filtered(),agg=aggregate(list),max=agg[0]?.[1]||1;n.textContent=fmt(list.length);bars.innerHTML='';agg.forEach(([k,v],i)=>{const row=document.createElement('div');row.className='bar'+(selected===k?' active':'');const col=mode==='color'?(colorHex[k]||'#934633'):mode==='typeface'?({Serif:'#765b49',Script:'#b06a7d','Sans-serif':'#477083',Fancy:'#7a6a9b'}[k]||'#934633'):'#934633';row.innerHTML=`<span>${k}</span><span class="track"><i class="fill" style="width:${v/max*100}%;background:${col}"></i></span><b>${fmt(v)}</b>`;row.onclick=()=>{selected=k;drawSamples(list,k);draw()};bars.append(row)});if(!selected&&agg[0]){selected=agg[0][0];drawSamples(list,selected)}}document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;selected='';document.querySelectorAll('.tab').forEach(x=>x.setAttribute('aria-pressed',x===b));draw()});year.onchange=()=>{selected='';draw()};draw();reportHeight()})();</script></body></html>
