<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gambar 2 | Pipeline</title><link rel="stylesheet" href="../assets/css/figures.css"></head><body class="figure-page"><figure class="interactive-figure"><div class="figure-toolbar"><div><p class="figure-kicker">Gambar 2</p><h1>Pipeline Pendekatan Humaniora Digital dan Analisis Sampul Buku</h1><p class="figure-deck">Pilih setiap tahap untuk membaca keputusan analitis dan keluaran yang dihasilkan.</p></div></div><div class="pipeline-grid" id="pipeline"></div><div class="pipeline-detail" id="detail"></div><p class="figure-source">Pipeline bersifat iteratif. Pembersihan data dapat dilakukan kembali setelah galat ditemukan pada tahap analisis atau visualisasi.</p></figure><script>
const steps=[['Scraping data','Pengambilan sampul dan metadata dari Goodreads dengan Python dan BeautifulSoup4.','Keluaran: berkas gambar, judul, penulis, tahun, penerbit, genre, tautan, rating, jumlah rating, dan ulasan.'],['Data cleaning','Pemeriksaan tipe angka, tahun terbit, duplikasi, nama berkas, serta hubungan antara metadata dan gambar.','Keluaran: data tabular yang dapat diproses dan ditelusuri kembali.'],['Analisis warna','K-Means mengelompokkan piksel, kemudian warna dibaca dalam ruang HSV dan dipetakan ke sebelas kategori.','Keluaran: lima klaster warna beserta proporsi piksel pada setiap sampul.'],['Analisis tipografi','EasyOCR membaca teks, fuzzy matching memeriksa kecocokan judul, lalu CLIP membandingkan bentuk huruf dengan basis data font.','Keluaran: prediksi font, typeface, nilai kecocokan, dan penanda ketidakpastian.'],['Analisis ilustrasi','CLIP membandingkan gambar penuh dengan deskripsi tekstual sepuluh corak ilustrasi.','Keluaran: kategori corak, skor keyakinan, dan distribusi berdasarkan genre serta tahun.'],['Interpretasi','Visualisasi digunakan sebagai peta untuk membaca pola, penyimpangan, dan konteks budaya secara dekat.','Keluaran: argumentasi humaniora yang tidak direduksi menjadi hasil klasifikasi mesin.']];const p=document.getElementById('pipeline'),d=document.getElementById('detail');function activate(i){[...p.children].forEach((x,j)=>x.classList.toggle('active',i===j));d.innerHTML=`<h2>${i+1}. ${steps[i][0]}</h2><p>${steps[i][1]} ${steps[i][2]}</p>`}steps.forEach((s,i)=>{const b=document.createElement('button');b.className='pipeline-card';b.innerHTML=`<strong>${i+1}</strong><b>${s[0]}</b><span>${s[1]}</span>`;b.onclick=()=>activate(i);p.appendChild(b)});activate(0);
</script><script src="../assets/js/figure-common.js"></script></body></html>
