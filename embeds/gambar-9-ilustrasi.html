<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Distribusi dan Tren Gaya Ilustrasi Sampul Buku</title><style>
:root{--ink:#171714;--muted:#706b63;--paper:#f8f5ef;--panel:#fff;--line:#d8d2c8;--accent:#934734;--shadow:0 18px 48px rgba(40,34,26,.10);--serif:Georgia,"Times New Roman",serif;--sans:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans)}button,input,select{font:inherit}a{color:inherit}.eyebrow{margin:0 0 8px;color:var(--accent);font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase}.visual-title{margin:0;font-family:var(--serif);font-size:clamp(28px,4.2vw,52px);font-weight:400;line-height:1.05;letter-spacing:-.035em}.visual-sub{max-width:760px;margin:10px 0 0;color:var(--muted);font-size:14px;line-height:1.55}.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.control{min-height:42px;border:1px solid var(--line);border-radius:10px;background:#fff;padding:9px 12px}.button{cursor:pointer;border:1px solid var(--ink);border-radius:999px;background:var(--ink);color:#fff;padding:10px 16px;font-size:12px;font-weight:800}.button.ghost{background:#fff;color:var(--ink);border-color:var(--line)}.metric{font-family:var(--serif);font-size:34px;line-height:1}.muted{color:var(--muted)}.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
@media(max-width:680px){.visual-title{font-size:34px}.visual-sub{font-size:13px}.card{border-radius:13px}.toolbar{align-items:stretch}.control{width:100%}.button{min-height:44px}}
body{padding:18px}.wrap{max-width:1180px;margin:auto}.head{margin-bottom:18px}.heat{display:grid;grid-template-columns:minmax(115px,1.4fr) repeat(10,minmax(65px,1fr));min-width:920px}.cell{min-height:42px;display:flex;align-items:center;justify-content:center;border:1px solid #fff;font-size:10px;font-weight:800}.cell.label{justify-content:flex-start;padding-left:8px;background:#f1eee7;position:sticky;left:0}.cell.head{height:94px;writing-mode:vertical-rl;transform:rotate(180deg);background:#edf3e5}.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:11px}.legend span{display:flex;align-items:center;gap:6px}.legend i{width:12px;height:3px}@media(max-width:680px){body{padding:10px}.heat{min-width:850px}}</style></head><body><main class="wrap"><header class="head"><p class="eyebrow">Gambar 9</p><h1 class="visual-title">Distribusi dan Tren Gaya Ilustrasi Sampul Buku</h1><p class="visual-sub">Peta panas genre × gaya ilustrasi dan grafik tren tahunan dihitung ulang dari CSV publikasi.</p></header><div class="toolbar" style="margin-bottom:14px"><select id="group" class="control"><option value="all">Semua genre</option><option value="bentuk">Klaster K1</option><option value="populer">Klaster K2</option><option value="mode">Klaster K3</option></select></div><div class="card" style="padding:14px;overflow:auto"><div id="heat" class="heat"></div></div><div class="card" style="padding:16px;margin-top:12px"><h2 style="font-family:var(--serif);font-weight:400;margin:0 0 10px">Tren gaya ilustrasi per tahun</h2><div style="height:300px"><canvas id="canvas"></canvas></div><div class="legend"><span><i style="background:#1477cc"></i>Kartunal</span><span><i style="background:#2f9147"></i>Minimalis</span><span><i style="background:#d94d32"></i>Ekspresionisme</span></div></div></main><script>let S;function render(){const gs=group.value==='all'?S.orders.genres:S.groups[group.value],order=S.orders.illustrations;heat.innerHTML='<div class="cell head label">Genre</div>'+order.map(k=>`<div class="cell head">${S.labels.illustrations[k]}</div>`).join('');gs.forEach(g=>{heat.insertAdjacentHTML('beforeend',`<div class="cell label">${g}</div>`);order.forEach(k=>{const v=S.genres[g].illustrations[k],a=.08+.92*Math.min(1,v/65);heat.insertAdjacentHTML('beforeend',`<div class="cell" style="background:rgba(12,127,153,${a});color:${v>35?'white':'#171714'}">${v.toLocaleString('id-ID',{maximumFractionDigits:1})}%</div>`)});});reportHeight()}function draw(){const rows=S.yearly_illustration.filter(x=>x.year>=2000&&x.year<=2025),box=canvas.getBoundingClientRect(),d=Math.min(2,devicePixelRatio||1);canvas.width=box.width*d;canvas.height=box.height*d;const c=canvas.getContext('2d');c.scale(d,d);const W=box.width,H=box.height,p={l:38,r:12,t:14,b:30},max=70;c.font='10px system-ui';for(let y=0;y<=60;y+=15){const py=p.t+(H-p.t-p.b)*(1-y/max);c.strokeStyle='#ddd6cc';c.beginPath();c.moveTo(p.l,py);c.lineTo(W-p.r,py);c.stroke();c.fillStyle='#706b63';c.fillText(y+'%',3,py+3)}function line(k,col){c.strokeStyle=col;c.lineWidth=2.2;c.beginPath();rows.forEach((r,i)=>{const x=p.l+i*(W-p.l-p.r)/(rows.length-1),y=p.t+(H-p.t-p.b)*(1-r[k]/max);i?c.lineTo(x,y):c.moveTo(x,y)});c.stroke()}line('kartunal','#1477cc');line('minimalis','#2f9147');line('ekspresionisme','#d94d32');[2000,2005,2010,2015,2020,2025].forEach(y=>{const i=rows.findIndex(r=>r.year===y),x=p.l+i*(W-p.l-p.r)/(rows.length-1);c.fillStyle='#706b63';c.fillText(y,x-10,H-7)})}fetch('../data/summary.json').then(r=>r.json()).then(s=>{S=s;group.onchange=render;render();draw()});addEventListener('resize',()=>S&&draw())

function reportHeight(){try{parent.postMessage({type:'embed-height',height:Math.ceil(document.documentElement.scrollHeight)},'*')}catch(e){}}
addEventListener('load',()=>setTimeout(reportHeight,80));addEventListener('resize',()=>setTimeout(reportHeight,80));new ResizeObserver(()=>reportHeight()).observe(document.body);
</script></body></html>
