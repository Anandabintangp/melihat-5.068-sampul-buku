<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gambar 9 | Ilustrasi</title><style>
:root{--paper:#f5f1e8;--ink:#1b1915;--muted:#6e675d;--rule:rgba(27,25,21,.18);--accent:#934633;--sans:Inter,Arial,"Helvetica Neue",sans-serif;--serif:Georgia,"Times New Roman",serif}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--paper);color:var(--ink)}body{font-family:var(--sans);text-rendering:optimizeLegibility;-webkit-font-smoothing:antialiased}
.app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto;padding:clamp(12px,1.6vw,22px);gap:clamp(9px,1.1vw,14px)}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;min-width:0}.kicker{margin:0 0 5px;color:var(--accent);font-size:11px;font-weight:850;letter-spacing:.14em;text-transform:uppercase}.head h1{margin:0;font-family:var(--serif);font-size:clamp(25px,3.1vw,46px);font-weight:400;line-height:1.02;letter-spacing:-.035em}.deck{margin:6px 0 0;color:var(--muted);font-size:clamp(11px,1.05vw,14px);line-height:1.42}.source{margin:0;padding-top:8px;border-top:1px solid var(--rule);color:var(--muted);font-size:10.5px;line-height:1.35}
.controls{display:flex;align-items:end;gap:8px;flex-wrap:wrap;justify-content:flex-end}.controls label{display:grid;gap:4px;color:var(--muted);font-size:10px;font-weight:750}.controls select,.controls input,.controls button,.tab{min-height:36px;border:1px solid var(--rule);background:#fbf9f4;color:var(--ink);padding:7px 10px;font:700 12px var(--sans)}.controls button,.tab{cursor:pointer}.controls button:hover,.tab[aria-pressed=true]{border-color:var(--accent);color:var(--accent)}
.panel{min-width:0;min-height:0;border:1px solid var(--rule);background:#fbf9f4;overflow:hidden}.tabs{display:flex;gap:6px}.tab{border-radius:999px;padding-inline:14px}
@media(max-width:680px){.app{padding:10px;gap:8px}.head{align-items:flex-start;flex-direction:column}.controls{width:100%;justify-content:flex-start}.head h1{font-size:27px}.source{font-size:9.5px}}

.app{grid-template-rows:auto auto minmax(0,1fr) auto}.illus{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(220px,.8fr);min-height:0}.matrix{display:grid;grid-template-columns:115px repeat(10,1fr);grid-auto-rows:minmax(22px,1fr);font-size:8.5px;min-height:0}.c{display:grid;place-items:center;border-right:1px solid #fff;border-bottom:1px solid #fff;cursor:pointer}.lab{justify-items:start;padding-left:6px;background:#f1ede5;font-weight:750}.hd{writing-mode:vertical-rl;transform:rotate(180deg);background:#ddd7cc;font-weight:800;padding:4px 0}.lex{padding:13px;border-left:1px solid var(--rule);display:grid;grid-template-rows:auto 1fr;gap:10px}.lex h2{margin:0;font:400 28px/1 var(--serif)}.art{position:relative;min-height:0;border:1px solid var(--rule);background:#e8dfd2;overflow:hidden}.art::before,.art::after{content:"";position:absolute}.art.kartunal::before{width:90px;height:90px;border:4px solid #222;border-radius:50%;left:22%;top:18%;background:#f0b95f;box-shadow:75px 55px 0 -18px #d66b50}.art.minimalis::before{inset:18%;background:#1b1915;clip-path:polygon(0 72%,45% 0,100% 100%)}.art.ekspresionisme::before{inset:-10%;background:repeating-linear-gradient(115deg,#1b1915 0 8px,#9a4734 8px 18px,#e1cbb1 18px 28px);transform:skew(-8deg) rotate(-4deg)}.art.fotografi_kolase::before{inset:10%;background:linear-gradient(135deg,#aaa 50%,transparent 50%),linear-gradient(45deg,#6b6257 50%,#ddd 50%);filter:grayscale(1)}.art.abstrak::before{width:70%;height:65%;left:14%;top:18%;background:conic-gradient(from 40deg,#9d4e39,#e1b54f,#527f82,#765d8c,#9d4e39);border-radius:45% 55% 60% 40%}.art.surealis_absurd::before{width:110px;height:150px;left:28%;top:10%;background:#e4c8aa;border-radius:50% 50% 25% 25%;box-shadow:55px 35px 0 -35px #111;transform:rotate(12deg)}.art.dekoratif::before{inset:8%;background:radial-gradient(circle,#9c4935 0 5px,transparent 6px);background-size:24px 24px;border:6px double #76614f}.art.pop_art::before{inset:10%;background:radial-gradient(circle,#111 0 3px,transparent 4px),#edc94c;background-size:12px 12px;box-shadow:inset 0 0 0 25px #d54a3e}.art.realisme::before{width:120px;height:160px;left:25%;top:8%;background:linear-gradient(#d9b39d 0 52%,#374a51 52%);border-radius:48% 48% 30% 30%;box-shadow:inset 0 0 20px rgba(0,0,0,.2)}.art.kubisme::before{inset:12%;background:conic-gradient(from 20deg at 40% 40%,#cf6a45,#ddc162,#4d7180,#927191,#cf6a45);clip-path:polygon(0 25%,35% 0,100% 18%,82% 100%,20% 85%)}.trend{display:none;padding:12px}.trend svg{width:100%;height:100%}@media(max-width:700px){.illus{grid-template-columns:1fr}.lex{display:none}.matrix{grid-template-columns:80px repeat(10,1fr);font-size:7px}}</style></head><body><main class="app"><header class="head"><div><p class="kicker">Gambar 9</p><h1>Distribusi dan tren gaya ilustrasi</h1><p class="deck">Pilih sel untuk melihat bahasa visual setiap corak ilustrasi.</p></div></header><nav class="tabs"><button class="tab" data-tab="heat" aria-pressed="true">Distribusi genre</button><button class="tab" data-tab="trend">Tren tahunan</button></nav><section class="panel illus"><div class="matrix" id="matrix"></div><div class="trend" id="trend"></div><aside class="lex"><div><p class="kicker" id="genreName">HOROR</p><h2 id="styleName">Ekspresionisme</h2></div><div class="art ekspresionisme" id="art"></div></aside></section><footer class="source" id="note">Klik sel untuk membaca persentase dan melihat karakter visualnya.</footer></main><script>
function reportHeight(){try{parent.postMessage({type:'kartografi-embed-height',height:Math.ceil(document.documentElement.scrollHeight)},'*')}catch(e){}}
addEventListener('load',reportHeight);addEventListener('resize',reportHeight,{passive:true});if('ResizeObserver'in window)new ResizeObserver(reportHeight).observe(document.body);
const fmt=n=>Number(n||0).toLocaleString('id-ID',{maximumFractionDigits:1});

(async()=>{const s=await fetch('../data/summary.json').then(r=>r.json()),styles=s.orders.illustrations,genres=s.orders.genres,pal=['#c87843','#64816a','#a24d45','#6e7278','#8a6c9f','#a47a57','#6f8d79','#c25c57','#6c7d8a','#8c765e'];function label(x){return (s.labels.illustrations&&s.labels.illustrations[x])||x.replaceAll('_',' ')}function show(g,st){genreName.textContent=g.toUpperCase();styleName.textContent=label(st);art.className='art '+st;note.textContent=`${g} · ${label(st)}: ${fmt(s.genres[g].illustrations[st]||0)}%`}function drawHeat(){matrix.innerHTML='<div class="c hd"></div>';styles.forEach(st=>{const h=document.createElement('div');h.className='c hd';h.textContent=label(st);matrix.append(h)});genres.forEach(g=>{const l=document.createElement('div');l.className='c lab';l.textContent=g;matrix.append(l);styles.forEach((st,i)=>{const v=s.genres[g].illustrations[st]||0,e=document.createElement('button');e.className='c';e.textContent=fmt(v);e.style.background=`color-mix(in srgb, ${pal[i]} ${36+v*1.25}%, white)`;e.style.color=v>30?'#fff':'#211f1a';e.onclick=()=>show(g,st);matrix.append(e)})})}function drawTrend(){const chosen=['kartunal','minimalis','ekspresionisme'];const rows=s.yearly_illustration,years=rows.map(r=>r.year),W=700,H=360,pad=38,max=50;let svg=`<svg viewBox="0 0 ${W} ${H}" aria-label="Tren ilustrasi">`;[0,10,20,30,40,50].forEach(v=>{const y=H-pad-v/max*(H-pad*2);svg+=`<line x1="${pad}" y1="${y}" x2="${W-pad}" y2="${y}" stroke="#ddd"/><text x="5" y="${y+4}" font-size="10">${v}%</text>`});chosen.forEach((st,i)=>{const pts=years.map((y,j)=>{const x=pad+j/(years.length-1)*(W-pad*2),v=rows[j][st]||0,yy=H-pad-v/max*(H-pad*2);return x+','+yy}).join(' ');svg+=`<polyline fill="none" stroke="${pal[i]}" stroke-width="3" points="${pts}"/><text x="${W-150}" y="${28+i*18}" fill="${pal[i]}" font-size="11">${label(st)}</text>`});svg+='</svg>';trend.innerHTML=svg}drawHeat();show('Horor','ekspresionisme');document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{const t=b.dataset.tab;document.querySelectorAll('.tab').forEach(x=>x.setAttribute('aria-pressed',x===b));matrix.style.display=t==='heat'?'grid':'none';trend.style.display=t==='trend'?'block':'none';if(t==='trend')drawTrend();reportHeight()});reportHeight()})();</script></body></html>
