<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gambar 9 | Gaya Ilustrasi</title><link rel="stylesheet" href="../assets/css/style.css"><link rel="stylesheet" href="../assets/css/figures.css"></head><body class="figure-page"><figure class="interactive-figure"><div class="figure-toolbar"><div><p class="figure-kicker">Gambar 9</p><h1>Distribusi dan Tren Gaya Ilustrasi</h1><p class="figure-deck">Beralih antara peta panas genre dan tren tahunan untuk membedakan pola genre dari perubahan temporal.</p></div><div class="controls"><label>Genre<select id="genre"><option value="">Semua genre</option></select></label></div></div><div class="tabs"><button data-tab="heat" aria-pressed="true">Distribusi genre</button><button data-tab="trend" aria-pressed="false">Tren tahunan</button></div><div class="chart-host" id="chart"></div><p class="figure-source">Tren tahunan menunjukkan proporsi kategori pada buku yang memiliki tahun terbit valid dalam rentang 2000–2025.</p></figure><script src="../assets/js/charts.js"></script><script src="../assets/js/figure-common.js"></script><script>
KF.loadSummary().then(s=>{const sel=document.getElementById('genre'),buttons=[...document.querySelectorAll('.tabs button')];s.orders.genres.forEach(g=>sel.add(new Option(g,g)));sel.value='Horor';let tab='heat';function draw(){buttons.forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.tab===tab)));sel.style.visibility=tab==='heat'?'visible':'hidden';if(tab==='heat')KartografiCharts.drawHeatmap('chart',s,'illustrations',sel.value?[sel.value]:[]);else KartografiCharts.drawTrend('chart',s,['kartunal','minimalis','ekspresionisme'])}buttons.forEach(b=>b.onclick=()=>{tab=b.dataset.tab;draw()});sel.onchange=draw;draw()}).catch(e=>document.getElementById('chart').textContent=e.message);
</script></body></html>
