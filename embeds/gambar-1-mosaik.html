function draw(){size();ctx.fillStyle='#f3f3f3';ctx.fillRect(0,0,vp.clientWidth,vp.clientHeight);ctx.save();ctx.translate(ox,oy);ctx.scale(scale,scale);if(preview.complete&&preview.naturalWidth)ctx.drawImage(preview,0,0,W,H);ctx.restore();if(!booksReady)return;const px=TW*scale;if(px<=8)return;const cw=(TW+G)*scale,ch=(TH+G)*scale;const c0=Math.max(0,Math.floor(-ox/cw)-1),c1=Math.min(COLS-1,Math.ceil((vp.clientWidth-ox)/cw)+1),r0=Math.max(0,Math.floor(-oy/ch)-1),r1=Math.min(ROWS-1,Math.ceil((vp.clientHeight-oy)/ch)+1);let requested=0;for(let r=r0;r<=r1;r++)for(let col=c0;col<=c1;col++){const book=books[r*COLS+col];if(!book)continue;const x=ox+col*(TW+G)*scale,y=oy+r*(TH+G)*scale,w=TW*scale,h=TH*scale,entry=imgFor(book);if(entry.state===1&&requested++<180)ctx.drawImage(entry.image,x,y,w,h)}}
function zoom(f,cx=vp.clientWidth/2,cy=vp.clientHeight/2){const old=scale,next=Math.max(minScale,Math.min(maxScale,scale*f)),wx=(cx-ox)/old,wy=(cy-oy)/old;scale=next;ox=cx-wx*next;oy=cy-wy*next;clamp();readout.textContent=Math.round(scale/minScale*100)+'%';draw()}
document.getElementById('plus').onclick=()=>zoom(1.45);document.getElementById('minus').onclick=()=>zoom(1/1.45);document.getElementById('fit').onclick=fitView;readout.onclick=fitView;
vp.addEventListener('wheel',e=>{e.preventDefault();const r=vp.getBoundingClientRect();zoom(e.deltaY<0?1.2:1/1.2,e.clientX-r.left,e.clientY-r.top)},{passive:false});
vp.onpointerdown=e=>{vp.setPointerCapture(e.pointerId);drag=true;moved=false;last={x:e.clientX,y:e.clientY};vp.classList.add('dragging')};
vp.onpointermove=e=>{if(!drag)return;const dx=e.clientX-last.x,dy=e.clientY-last.y;if(Math.abs(dx)+Math.abs(dy)>3)moved=true;ox+=dx;oy+=dy;last={x:e.clientX,y:e.clientY};clamp();draw()};
vp.onpointerup=e=>{drag=false;vp.classList.remove('dragging');if(moved||!booksReady)return;const r=vp.getBoundingClientRect(),wx=(e.clientX-r.left-ox)/scale,wy=(e.clientY-r.top-oy)/scale,col=Math.floor(wx/(TW+G)),row=Math.floor(wy/(TH+G)),book=books[row*COLS+col];if(!book)return;detail.hidden=false;titleEl.textContent=book.title||'Tanpa judul';authorEl.textContent=book.author||'Penulis tidak tersedia';metaEl.textContent=[book.year,(book.genres||[]).slice(0,3).join(' · ')].filter(Boolean).join(' · ');cover.src=coverURL(book)};
loadJSON().then(data=>{books=data;booksReady=true;draw()}).catch(error=>{console.warn(error);errorBox.hidden=false;errorBox.innerHTML='<div><b>Data detail sampul belum dapat dimuat.</b><br><small>Pratinjau mosaik tetap dapat digunakan.</small></div>'});
addEventListener('resize',fitView,{passive:true});addEventListener('load',()=>{if(preview.complete)fitView();reportHeight()});
</script>
