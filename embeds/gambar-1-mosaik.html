<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mosaik 5.068 Sampul Buku</title>
<style>
:root{--ink:#171714;--muted:#6e6961;--paper:#f7f5f0;--panel:#fff;--line:#d9d4cb;--accent:#944832;--sans:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
*{box-sizing:border-box}html,body{height:100%;margin:0;overflow:hidden}body{background:#fff;color:var(--ink);font-family:var(--sans)}button{font:inherit}.app{height:100vh;min-height:440px;padding:10px;display:grid;grid-template-rows:minmax(0,1fr) auto}.stage{position:relative;min-height:0;overflow:hidden;border:1px solid var(--line);border-radius:16px 16px 0 0;background:#eae6df;touch-action:none;cursor:grab}.stage.dragging{cursor:grabbing}canvas{display:block;width:100%;height:100%}.hint{position:absolute;left:13px;top:13px;z-index:3;padding:7px 10px;border-radius:999px;background:rgba(23,23,20,.82);color:#fff;font-size:10px;pointer-events:none}.loading{position:absolute;left:50%;top:50%;z-index:4;transform:translate(-50%,-50%);width:min(330px,calc(100% - 36px));padding:18px;border:1px solid rgba(255,255,255,.45);border-radius:16px;background:rgba(23,23,20,.88);color:#fff;text-align:center;backdrop-filter:blur(9px);transition:opacity .35s ease,visibility .35s ease}.loading.done{opacity:0;visibility:hidden}.loading strong{display:block;font-size:28px}.loading span{display:block;margin-top:4px;color:#d9d4cb;font-size:11px}.progress{height:7px;margin-top:12px;overflow:hidden;border-radius:999px;background:rgba(255,255,255,.17)}.progress i{display:block;width:0;height:100%;border-radius:inherit;background:#fff;transition:width .18s ease}.controls{display:flex;align-items:center;justify-content:center;gap:8px;padding:10px;border:1px solid var(--line);border-top:0;border-radius:0 0 16px 16px;background:#fff}.controls button,.controls a{display:inline-grid;place-items:center;min-width:46px;min-height:40px;padding:8px 13px;border:1px solid var(--line);border-radius:999px;background:#fff;color:var(--ink);text-decoration:none;font-size:11px;font-weight:800;cursor:pointer}.zoom{min-width:72px;text-align:center;font-size:12px;font-weight:800}.status{margin-left:auto;color:var(--muted);font-size:10px;white-space:nowrap}
@media(max-width:680px){.app{padding:6px;min-height:520px}.stage{border-radius:12px 12px 0 0}.hint{font-size:9px;max-width:calc(100% - 26px)}.controls{flex-wrap:wrap;border-radius:0 0 12px 12px}.controls button,.controls a{min-height:42px}.status{width:100%;margin:2px 0 0;text-align:center}.loading strong{font-size:24px}}
</style>
</head>
<body>
<main class="app">
  <section id="stage" class="stage" aria-label="Mosaik interaktif 5.068 sampul buku">
    <canvas id="canvas"></canvas>
    <div class="hint">Roda tetikus atau cubit untuk memperbesar · seret untuk menggeser</div>
    <div id="loading" class="loading" role="status" aria-live="polite">
      <strong id="loadingPct">0%</strong>
      <span id="loadingText">Menyiapkan mosaik sampul…</span>
      <div class="progress"><i id="progressBar"></i></div>
    </div>
  </section>
  <footer class="controls">
    <button id="minus" type="button" aria-label="Perkecil mosaik">−</button>
    <span id="zoom" class="zoom">100%</span>
    <button id="plus" type="button" aria-label="Perbesar mosaik">+</button>
    <button id="fit" type="button">Tampilkan semua</button>
    <a href="./gambar-1-mosaik.html" target="_blank">Buka penuh ↗</a>
    <span id="status" class="status">Memuat metadata sampul…</span>
  </footer>
</main>
<script>
const COVER='https://risethumdigsasindo.github.io/Kartografi-Sampul-Sastra-Indonesia/covers/';
const COLS=72,CELL_W=37,CELL_H=55,GAP=1;
let books=[],ctx,W=0,H=0,dpr=1,worldW=0,worldH=0,scale=1,minScale=1,tx=0,ty=0;
let dragging=false,lastX=0,lastY=0,pointers=new Map(),pinchDistance=0;
let base=document.createElement('canvas'),baseCtx=base.getContext('2d',{alpha:false});
let completed=0,activeLoads=0,nextIndex=0,drawQueued=false;
const highCache=new Map(),highLoading=new Set(),MAX_HIGH=140;
const concurrency=matchMedia('(max-width:680px)').matches?10:20;

function resize(){
  const r=stage.getBoundingClientRect();dpr=Math.min(2,devicePixelRatio||1);W=r.width;H=r.height;
  canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);canvas.style.width=W+'px';canvas.style.height=H+'px';ctx=canvas.getContext('2d');
  if(books.length)fitAll();
}
function initBase(){
  const rows=Math.ceil(books.length/COLS);worldW=COLS*(CELL_W+GAP)-GAP;worldH=rows*(CELL_H+GAP)-GAP;base.width=Math.ceil(worldW);base.height=Math.ceil(worldH);
  baseCtx.fillStyle='#e7e2da';baseCtx.fillRect(0,0,base.width,base.height);
  books.forEach((b,i)=>{const x=(i%COLS)*(CELL_W+GAP),y=Math.floor(i/COLS)*(CELL_H+GAP);baseCtx.fillStyle=b.palette?.[0]?.hex||'#bdb7ad';baseCtx.fillRect(x,y,CELL_W,CELL_H)});
}
function fitAll(){
  minScale=Math.min((W-16)/worldW,(H-16)/worldH);scale=minScale;tx=(W-worldW*scale)/2;ty=(H-worldH*scale)/2;draw();
}
function clampPan(){
  const sw=worldW*scale,sh=worldH*scale,margin=70;
  if(sw<=W){tx=(W-sw)/2}else tx=Math.min(margin,Math.max(W-sw-margin,tx));
  if(sh<=H){ty=(H-sh)/2}else ty=Math.min(margin,Math.max(H-sh-margin,ty));
}
function drawCoverCrop(targetCtx,img,x,y,w,h){
  const ir=img.width/img.height,tr=w/h;let sx=0,sy=0,sw=img.width,sh=img.height;
  if(ir>tr){sw=img.height*tr;sx=(img.width-sw)/2}else{sh=img.width/tr;sy=(img.height-sh)/2}
  targetCtx.drawImage(img,sx,sy,sw,sh,x,y,w,h);
}
function scheduleDraw(){if(drawQueued)return;drawQueued=true;requestAnimationFrame(()=>{drawQueued=false;draw()})}
function draw(){
  if(!ctx||!books.length)return;ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,W,H);ctx.save();ctx.translate(tx,ty);ctx.scale(scale,scale);ctx.imageSmoothingEnabled=true;ctx.drawImage(base,0,0);
  const ratio=scale/minScale;
  if(ratio>4){
    const x0=Math.max(0,Math.floor((-tx/scale)/(CELL_W+GAP))-1),x1=Math.min(COLS-1,Math.ceil(((W-tx)/scale)/(CELL_W+GAP))+1);
    const rows=Math.ceil(books.length/COLS),y0=Math.max(0,Math.floor((-ty/scale)/(CELL_H+GAP))-1),y1=Math.min(rows-1,Math.ceil(((H-ty)/scale)/(CELL_H+GAP))+1);
    for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){
      const i=y*COLS+x;if(i>=books.length)continue;const px=x*(CELL_W+GAP),py=y*(CELL_H+GAP),img=highCache.get(i);
      if(img){drawCoverCrop(ctx,img,px,py,CELL_W,CELL_H);touchHigh(i)}else loadHigh(i);
    }
  }
  ctx.restore();zoom.textContent=Math.round(ratio*100)+'%';
}
function touchHigh(i){const img=highCache.get(i);if(!img)return;highCache.delete(i);highCache.set(i,img)}
function loadHigh(i){
  if(highCache.has(i)||highLoading.has(i))return;highLoading.add(i);const img=new Image();img.decoding='async';img.onload=()=>{highLoading.delete(i);highCache.set(i,img);while(highCache.size>MAX_HIGH)highCache.delete(highCache.keys().next().value);scheduleDraw()};img.onerror=()=>highLoading.delete(i);img.src=COVER+encodeURIComponent(books[i].image);
}
function zoomAt(factor,x,y){
  const next=Math.max(minScale,Math.min(minScale*45,scale*factor)),wx=(x-tx)/scale,wy=(y-ty)/scale;tx=x-wx*next;ty=y-wy*next;scale=next;clampPan();draw();
}
function updateProgress(){
  const p=books.length?Math.round(completed/books.length*100):0;loadingPct.textContent=p+'%';progressBar.style.width=p+'%';loadingText.textContent=`${new Intl.NumberFormat('id-ID').format(completed)} dari ${new Intl.NumberFormat('id-ID').format(books.length)} sampul dimuat`;status.textContent=p<100?`Memuat sampul ${p}%`:`${new Intl.NumberFormat('id-ID').format(books.length)} sampul siap`;
  if(completed>=books.length)setTimeout(()=>loading.classList.add('done'),450);
}
function startNext(){
  while(activeLoads<concurrency&&nextIndex<books.length){
    const i=nextIndex++;activeLoads++;const img=new Image();img.decoding='async';
    const done=ok=>{if(ok){const x=(i%COLS)*(CELL_W+GAP),y=Math.floor(i/COLS)*(CELL_H+GAP);drawCoverCrop(baseCtx,img,x,y,CELL_W,CELL_H)}completed++;activeLoads--;if(completed%8===0||completed===books.length)scheduleDraw();updateProgress();startNext()};
    img.onload=()=>done(true);img.onerror=()=>done(false);img.src=COVER+encodeURIComponent(books[i].image);
  }
}
stage.addEventListener('wheel',e=>{e.preventDefault();const r=stage.getBoundingClientRect();zoomAt(e.deltaY<0?1.18:.84,e.clientX-r.left,e.clientY-r.top)},{passive:false});
stage.addEventListener('pointerdown',e=>{pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});stage.setPointerCapture(e.pointerId);lastX=e.clientX;lastY=e.clientY;dragging=true;stage.classList.add('dragging');if(pointers.size===2){const a=[...pointers.values()];pinchDistance=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)}});
stage.addEventListener('pointermove',e=>{
  if(!pointers.has(e.pointerId))return;pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pointers.size===2){const a=[...pointers.values()],dist=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y),cx=(a[0].x+a[1].x)/2,cy=(a[0].y+a[1].y)/2,r=stage.getBoundingClientRect();if(pinchDistance)zoomAt(dist/pinchDistance,cx-r.left,cy-r.top);pinchDistance=dist;return}
  if(!dragging)return;tx+=e.clientX-lastX;ty+=e.clientY-lastY;lastX=e.clientX;lastY=e.clientY;clampPan();draw();
});
function pointerEnd(e){pointers.delete(e.pointerId);if(pointers.size<2)pinchDistance=0;if(!pointers.size){dragging=false;stage.classList.remove('dragging')}}
stage.addEventListener('pointerup',pointerEnd);stage.addEventListener('pointercancel',pointerEnd);
plus.onclick=()=>zoomAt(1.28,W/2,H/2);minus.onclick=()=>zoomAt(.78,W/2,H/2);fit.onclick=fitAll;
fetch('../data/books.min.json').then(r=>{if(!r.ok)throw new Error('Metadata tidak dapat dimuat');return r.json()}).then(data=>{books=data;initBase();resize();updateProgress();startNext()}).catch(err=>{loadingPct.textContent='Gagal';loadingText.textContent=err.message;status.textContent='Mosaik tidak dapat dimuat'});
addEventListener('resize',resize);
function reportHeight(){try{parent.postMessage({type:'embed-height',height:Math.ceil(document.documentElement.scrollHeight)},'*')}catch(e){}}
addEventListener('load',()=>setTimeout(reportHeight,80));addEventListener('resize',()=>setTimeout(reportHeight,80));
</script>
</body>
</html>
