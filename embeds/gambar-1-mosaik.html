<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gambar 1 · Mosaik Sampul</title>
<link rel="preload" as="image" href="../assets/mosaik-preview.webp" type="image/webp" fetchpriority="high">
<link rel="preconnect" href="https://risethumdigsasindo.github.io" crossorigin>
<style>
:root{--ink:#171717;--muted:#656565;--line:#dedede;--paper:#fff;--sans:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;--serif:Georgia,"Times New Roman",serif}
*{box-sizing:border-box}html,body{margin:0;background:#fff;color:var(--ink);font-family:var(--sans)}body{overflow:hidden}.app{width:100%;padding:8px;display:grid;gap:8px;justify-items:center}.stage{position:relative;width:min(100%,920px);height:min(68vh,540px);min-height:360px;overflow:hidden;border:1px solid var(--line);border-radius:14px;background:#f3f3f3;touch-action:none;cursor:grab}.stage.dragging{cursor:grabbing}canvas{display:block;width:100%;height:100%}.toolbar{position:absolute;z-index:8;top:10px;right:10px;display:grid;grid-template-columns:42px 76px 42px auto;gap:6px;padding:6px;border:1px solid rgba(0,0,0,.12);border-radius:14px;background:rgba(255,255,255,.94);box-shadow:0 7px 22px rgba(0,0,0,.08);backdrop-filter:blur(10px)}.toolbar button{min-height:38px;border:1px solid var(--line);border-radius:10px;background:#fff;color:#171717;padding:7px 12px;font:800 13px var(--sans);cursor:pointer}.toolbar button:hover,.toolbar button:focus-visible{border-color:#111}.hint{position:absolute;left:10px;bottom:10px;z-index:5;padding:7px 10px;border-radius:999px;background:rgba(20,20,20,.82);color:#fff;font-size:10px;pointer-events:none}.detail{position:absolute;right:10px;bottom:10px;z-index:7;width:min(320px,calc(100% - 20px));display:grid;grid-template-columns:56px 1fr;gap:10px;padding:10px;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.97);box-shadow:0 12px 30px rgba(0,0,0,.13)}.detail[hidden]{display:none}.detail img{width:56px;height:82px;object-fit:cover;border-radius:6px;background:#eee}.detail h2{margin:0 0 4px;font:700 14px/1.22 var(--serif)}.detail p{margin:2px 0;color:var(--muted);font-size:11px;line-height:1.35}.caption{width:min(100%,920px);padding:2px 4px 0;text-align:center;font-size:12px;font-weight:800;line-height:1.4}.error{position:absolute;inset:0;display:grid;place-items:center;padding:24px;text-align:center;background:#fff;color:#333}.error[hidden]{display:none}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
@media(max-width:680px){.app{padding:4px}.stage{height:min(64vh,430px);min-height:300px;border-radius:10px}.toolbar{top:6px;right:6px;grid-template-columns:38px 66px 38px auto;padding:4px;gap:4px}.toolbar button{min-height:34px;padding:6px 9px;font-size:11px}.hint{display:none}.caption{font-size:10.5px}.detail{right:6px;bottom:6px}}
</style>
</head>
<body>
<main class="app">
  <section class="stage" id="viewport" tabindex="0" aria-label="Mosaik interaktif 5.068 sampul buku">
    <canvas id="canvas"></canvas>
    <div class="toolbar" aria-label="Kontrol mosaik">
      <button id="minus" aria-label="Perkecil">−</button>
      <button id="readout" aria-label="Kembali ke tampilan penuh">100%</button>
      <button id="plus" aria-label="Perbesar">+</button>
      <button id="fit">Tampilkan semua</button>
    </div>
    <div class="hint">Roda tetikus atau cubit untuk zoom. Seret untuk menjelajah. Ketuk sampul untuk metadata.</div>
    <article class="detail" id="detail" hidden>
      <img id="cover" alt="">
      <div><h2 id="title"></h2><p id="author"></p><p id="meta"></p></div>
    </article>
    <div class="error" id="loadError" hidden></div>
  </section>
  <figcaption class="caption">Gambar 1 Mosaik Sampul Buku Sastra Indonesia dari Tahun 2000—2025</figcaption>
</main>
<script>
const COVER_BASE='https://risethumdigsasindo.github.io/Kartografi-Sampul-Sastra-Indonesia/covers/';
const COLS=86,ROWS=59,TW=72,TH=108,G=2,W=COLS*(TW+G)-G,H=ROWS*(TH+G)-G;
const vp=document.getElementById('viewport'),canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d');
const readout=document.getElementById('readout'),detail=document.getElementById('detail'),cover=document.getElementById('cover'),titleEl=document.getElementById('title'),authorEl=document.getElementById('author'),metaEl=document.getElementById('meta'),errorBox=document.getElementById('loadError');
let books=[],booksReady=false,scale=1,minScale=1,maxScale=15,ox=0,oy=0,drag=false,moved=false,last={x:0,y:0};
const cache=new Map();
function reportHeight(){try{parent.postMessage({type:'embed-height',height:Math.ceil(document.documentElement.scrollHeight)},'*')}catch(e){}}
function loadJSON(){const urls=[new URL('../data/books.min.json',location.href),new URL('./data/books.min.json',location.href)];return (async()=>{let last;for(const url of urls){try{const r=await fetch(url,{cache:'force-cache'});if(r.ok)return r.json();last=new Error('HTTP '+r.status)}catch(e){last=e}}throw last||new Error('books.min.json tidak ditemukan')})()}
function size(){const d=Math.min(2,devicePixelRatio||1);canvas.width=Math.round(vp.clientWidth*d);canvas.height=Math.round(vp.clientHeight*d);canvas.style.width=vp.clientWidth+'px';canvas.style.height=vp.clientHeight+'px';ctx.setTransform(d,0,0,d,0,0)}
function fitView(){size();minScale=Math.min(vp.clientWidth/W,vp.clientHeight/H)*.985;scale=minScale;ox=(vp.clientWidth-W*scale)/2;oy=(vp.clientHeight-H*scale)/2;draw();readout.textContent='100%';reportHeight()}
function clamp(){ox=Math.min(0,Math.max(vp.clientWidth-W*scale,ox));oy=Math.min(0,Math.max(vp.clientHeight-H*scale,oy));if(W*scale<vp.clientWidth)ox=(vp.clientWidth-W*scale)/2;if(H*scale<vp.clientHeight)oy=(vp.clientHeight-H*scale)/2}
function coverURL(book){return COVER_BASE+encodeURIComponent(book.image)}
function imgFor(book){let entry=cache.get(book.image);if(entry)return entry;if(cache.size>260){const first=cache.keys().next().value;cache.delete(first)}const image=new Image();image.decoding='async';entry={image,state:0};cache.set(book.image,entry);image.onload=()=>{entry.state=1;draw()};image.onerror=()=>entry.state=-1;image.src=coverURL(book);return entry}
const preview=new Image();preview.decoding='async';preview.fetchPriority='high';preview.onload=fitView;preview.onerror=()=>{errorBox.hidden=false;errorBox.textContent='Pratinjau mosaik belum dapat dimuat.'};preview.src='../assets/mosaik-preview.webp';
function draw(){size();ctx.fillStyle='#f3f3f3';ctx.fillRect(0,0,vp.clientWidth,vp.clientHeight);ctx.save();ctx.translate(ox,oy);ctx.scale(scale,scale);if(preview.complete&&preview.naturalWidth)ctx.drawImage(preview,0,0,W,H);ctx.restore();if(!booksReady)return;const px=TW*scale;if(px<=8)return;const cw=(TW+G)*scale,ch=(TH+G)*scale;const c0=Math.max(0,Math.floor(-ox/cw)-1),c1=Math.min(COLS-1,Math.ceil((vp.clientWidth-ox)/cw)+1),r0=Math.max(0,Math.floor(-oy/ch)-1),r1=Math.min(ROWS-1,Math.ceil((vp.clientHeight-oy)/ch)+1);let requested=0;for(let r=r0;r<=r1;r++)for(let col=c0;col<=c1;col++){const book=books[r*COLS+col];if(!book)continue;const x=ox+col*(TW+G)*scale,y=oy+r*(TH+G)*scale,w=TW*scale,h=TH*scale,entry=imgFor(book);if(entry.state===1&&requested++<180)ctx.drawImage(entry.image,x,y,w,h)}}
function zoom(f,cx=vp.clientWidth/2,cy=vp.clientHeight/2){const old=scale,next=Math.max(minScale,Math.min(maxScale,scale*f)),wx=(cx-ox)/old,wy=(cy-oy)/old;scale=next;ox=cx-wx*next;oy=cy-wy*next;clamp();readout.textContent=Math.round(scale/minScale*100)+'%';draw()}
document.getElementById('plus').onclick=()=>zoom(1.45);document.getElementById('minus').onclick=()=>zoom(1/1.45);document.getElementById('fit').onclick=fitView;readout.onclick=fitView;
vp.addEventListener('wheel',e=>{e.preventDefault();const r=vp.getBoundingClientRect();zoom(e.deltaY<0?1.2:1/1.2,e.clientX-r.left,e.clientY-r.top)},{passive:false});
vp.onpointerdown=e=>{vp.setPointerCapture(e.pointerId);drag=true;moved=false;last={x:e.clientX,y:e.clientY};vp.classList.add('dragging')};
vp.onpointermove=e=>{if(!drag)return;const dx=e.clientX-last.x,dy=e.clientY-last.y;if(Math.abs(dx)+Math.abs(dy)>3)moved=true;ox+=dx;oy+=dy;last={x:e.clientX,y:e.clientY};clamp();draw()};
vp.onpointerup=e=>{drag=false;vp.classList.remove('dragging');if(moved||!booksReady)return;const r=vp.getBoundingClientRect(),wx=(e.clientX-r.left-ox)/scale,wy=(e.clientY-r.top-oy)/scale,col=Math.floor(wx/(TW+G)),row=Math.floor(wy/(TH+G)),book=books[row*COLS+col];if(!book)return;detail.hidden=false;titleEl.textContent=book.title||'Tanpa judul';authorEl.textContent=book.author||'Penulis tidak tersedia';metaEl.textContent=[book.year,(book.genres||[]).slice(0,3).join(' · ')].filter(Boolean).join(' · ');cover.src=coverURL(book)};
loadJSON().then(data=>{books=data;booksReady=true;draw()}).catch(error=>{console.warn(error);errorBox.hidden=false;errorBox.innerHTML='<div><b>Data detail sampul belum dapat dimuat.</b><br><small>Pratinjau mosaik tetap dapat digunakan.</small></div>'});
addEventListener('resize',fitView,{passive:true});addEventListener('load',()=>{if(preview.complete)fitView();reportHeight()});
</script>
</body>
</html>
