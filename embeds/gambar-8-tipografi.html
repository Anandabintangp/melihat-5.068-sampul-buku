<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gambar 8 | Tipografi</title><link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;700&family=Creepster&family=Kalam:wght@400;700&family=Merienda:wght@400;700&family=Oranienbaum&family=Piazzolla:wght@400;700&family=Rajdhani:wght@400;700&family=Rozha+One&family=Yeseva+One&display=swap" rel="stylesheet"><style>
:root{--paper:#f5f1e8;--ink:#1b1915;--muted:#6e675d;--rule:rgba(27,25,21,.18);--accent:#934633;--sans:Inter,Arial,"Helvetica Neue",sans-serif;--serif:Georgia,"Times New Roman",serif}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--paper);color:var(--ink)}body{font-family:var(--sans);text-rendering:optimizeLegibility;-webkit-font-smoothing:antialiased}
.app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto;padding:clamp(12px,1.6vw,22px);gap:clamp(9px,1.1vw,14px)}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;min-width:0}.kicker{margin:0 0 5px;color:var(--accent);font-size:11px;font-weight:850;letter-spacing:.14em;text-transform:uppercase}.head h1{margin:0;font-family:var(--serif);font-size:clamp(25px,3.1vw,46px);font-weight:400;line-height:1.02;letter-spacing:-.035em}.deck{margin:6px 0 0;color:var(--muted);font-size:clamp(11px,1.05vw,14px);line-height:1.42}.source{margin:0;padding-top:8px;border-top:1px solid var(--rule);color:var(--muted);font-size:10.5px;line-height:1.35}
.controls{display:flex;align-items:end;gap:8px;flex-wrap:wrap;justify-content:flex-end}.controls label{display:grid;gap:4px;color:var(--muted);font-size:10px;font-weight:750}.controls select,.controls input,.controls button,.tab{min-height:36px;border:1px solid var(--rule);background:#fbf9f4;color:var(--ink);padding:7px 10px;font:700 12px var(--sans)}.controls button,.tab{cursor:pointer}.controls button:hover,.tab[aria-pressed=true]{border-color:var(--accent);color:var(--accent)}
.panel{min-width:0;min-height:0;border:1px solid var(--rule);background:#fbf9f4;overflow:hidden}.tabs{display:flex;gap:6px}.tab{border-radius:999px;padding-inline:14px}
@media(max-width:680px){.app{padding:10px;gap:8px}.head{align-items:flex-start;flex-direction:column}.controls{width:100%;justify-content:flex-start}.head h1{font-size:27px}.source{font-size:9.5px}}

.app{grid-template-rows:auto minmax(0,1fr) auto}.typo{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(230px,.85fr);min-height:0}.matrix{display:grid;grid-template-columns:125px repeat(4,1fr);grid-auto-rows:minmax(25px,1fr);font-size:10px;min-height:0}.mcell{display:grid;place-items:center;border-right:1px solid #fff;border-bottom:1px solid #fff;cursor:pointer}.mlabel{justify-items:start;padding-left:7px;background:#f1ede5;font-weight:750}.mhead{font-weight:850;background:#ded8ce}.spec{padding:12px;border-left:1px solid var(--rule);display:grid;grid-template-rows:auto 1fr;gap:9px;min-width:0}.spec h2{margin:0;font:400 25px/1 var(--serif)}.fontlist{display:grid;grid-template-columns:1fr 1fr;gap:7px;align-content:start}.fontcard{min-width:0;padding:8px;border:1px solid var(--rule);background:#fff}.fontcard strong{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:22px;font-weight:400;line-height:1.15}.fontcard span{display:block;margin-top:4px;color:var(--muted);font:700 9px var(--sans)}@media(max-width:700px){.typo{grid-template-columns:1fr}.spec{display:none}.matrix{grid-template-columns:90px repeat(4,1fr);font-size:8px}}</style></head><body><main class="app"><header class="head"><div><p class="kicker">Gambar 8</p><h1>Distribusi tipografi dan spesimen huruf</h1><p class="deck">Nilai ditampilkan sebagai peta panas. Nama font dirender menggunakan bentuk hurufnya sendiri.</p></div><div class="controls"><label>Genre<select id="genre"></select></label></div></header><section class="panel typo"><div class="matrix" id="matrix"></div><aside class="spec"><div><p class="kicker" id="cat">SERIF</p><h2 id="genreTitle">Fiksi Sejarah</h2></div><div class="fontlist" id="fontlist"></div></aside></section><footer class="source" id="note">Klik sel untuk melihat font dominan pada genre tersebut.</footer></main><script>
function reportHeight(){try{parent.postMessage({type:'kartografi-embed-height',height:Math.ceil(document.documentElement.scrollHeight)},'*')}catch(e){}}
addEventListener('load',reportHeight);addEventListener('resize',reportHeight,{passive:true});if('ResizeObserver'in window)new ResizeObserver(reportHeight).observe(document.body);
const fmt=n=>Number(n||0).toLocaleString('id-ID',{maximumFractionDigits:1});

(async()=>{const s=await fetch('../data/summary.json').then(r=>r.json()),cats=s.orders.typefaces,genres=s.orders.genres,pal={Serif:'#806957',Script:'#b67687','Sans-serif':'#557b8b',Fancy:'#786c9d'};genres.forEach(g=>genre.add(new Option(g,g)));genre.value='Fiksi Sejarah';const fallback={Serif:['Georgia','Times New Roman','Piazzolla','Rozha One'],Script:['Merienda','Kalam','Segoe Script','Brush Script MT'],'Sans-serif':['Be Vietnam Pro','Rajdhani','Arial','Trebuchet MS'],Fancy:['Creepster','Comic Sans MS','Impact','Cooper Black']};function fontStack(f,c){return `'${f}',${c==='Serif'?'Georgia,serif':c==='Script'?'"Segoe Script",cursive':c==='Sans-serif'?'Arial,sans-serif':'"Comic Sans MS",fantasy'}`}function show(g,c){cat.textContent=c.toUpperCase();genreTitle.textContent=g;const tops=(s.genres[g].top_fonts||[]).map(x=>x.font);const names=[...new Set([...tops,...fallback[c]])].slice(0,6);fontlist.innerHTML='';names.forEach((f,i)=>{const d=document.createElement('div');d.className='fontcard';d.innerHTML=`<strong style="font-family:${fontStack(f,c)}">Sampul Sastra</strong><span>${f}</span>`;fontlist.append(d)});note.textContent=`${g} · ${c}: ${fmt(s.genres[g].typefaces[c]||0)}%`}function draw(){matrix.innerHTML='<div class="mcell mhead"></div>';cats.forEach(c=>{const h=document.createElement('button');h.className='mcell mhead';h.textContent=c;h.style.fontFamily=fontStack(fallback[c][0],c);matrix.append(h)});genres.forEach(g=>{const l=document.createElement('div');l.className='mcell mlabel';l.textContent=g;matrix.append(l);cats.forEach(c=>{const v=s.genres[g].typefaces[c]||0,e=document.createElement('button');e.className='mcell';e.textContent=fmt(v);e.style.background=`color-mix(in srgb, ${pal[c]} ${35+v}%, white)`;e.style.color=v>40?'#fff':'#211f1a';e.style.fontFamily=fontStack(fallback[c][0],c);e.onclick=()=>show(g,c);matrix.append(e)})});show(genre.value,'Serif');reportHeight()}genre.onchange=()=>show(genre.value,'Serif');draw()})();</script></body></html>
