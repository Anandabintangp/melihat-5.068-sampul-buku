<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gambar 8 | Peta Panas Tipografi</title><link rel="stylesheet" href="../assets/css/style.css"><link rel="stylesheet" href="../assets/css/figures.css"></head><body class="figure-page"><figure class="interactive-figure"><div class="figure-toolbar"><div><p class="figure-kicker">Gambar 8</p><h1>Peta Panas Distribusi Tipografi</h1><p class="figure-deck">Pilih genre untuk menyorot distribusi Serif, Script, Sans-serif, dan Fancy.</p></div><div class="controls"><label>Genre<select id="genre"><option value="">Semua genre</option></select></label></div></div><div class="chart-host" id="chart"></div><p class="figure-source">Kategori menggunakan kolom typeface_paper. Hasil perlu dibaca sebagai kecenderungan korpus karena deteksi tipografi memiliki ketidakpastian teknis.</p></figure><script src="../assets/js/charts.js"></script><script src="../assets/js/figure-common.js"></script><script>KF.loadSummary().then(s=>{const sel=document.getElementById('genre');s.orders.genres.forEach(g=>sel.add(new Option(g,g)));sel.value='Fiksi Sejarah';function draw(){KartografiCharts.drawHeatmap('chart',s,'typefaces',sel.value?[sel.value]:[])}sel.onchange=draw;draw()}).catch(e=>document.getElementById('chart').textContent=e.message);</script></body></html>
