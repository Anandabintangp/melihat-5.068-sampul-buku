<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Peta Panas Distribusi Tipografi Sampul Buku</title><style>
:root{--ink:#171714;--muted:#706b63;--paper:#f8f5ef;--panel:#fff;--line:#d8d2c8;--accent:#934734;--shadow:0 18px 48px rgba(40,34,26,.10);--serif:Georgia,"Times New Roman",serif;--sans:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans)}button,input,select{font:inherit}a{color:inherit}.eyebrow{margin:0 0 8px;color:var(--accent);font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase}.visual-title{margin:0;font-family:var(--serif);font-size:clamp(28px,4.2vw,52px);font-weight:400;line-height:1.05;letter-spacing:-.035em}.visual-sub{max-width:760px;margin:10px 0 0;color:var(--muted);font-size:14px;line-height:1.55}.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.control{min-height:42px;border:1px solid var(--line);border-radius:10px;background:#fff;padding:9px 12px}.button{cursor:pointer;border:1px solid var(--ink);border-radius:999px;background:var(--ink);color:#fff;padding:10px 16px;font-size:12px;font-weight:800}.button.ghost{background:#fff;color:var(--ink);border-color:var(--line)}.metric{font-family:var(--serif);font-size:34px;line-height:1}.muted{color:var(--muted)}.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
@media(max-width:680px){.visual-title{font-size:34px}.visual-sub{font-size:13px}.card{border-radius:13px}.toolbar{align-items:stretch}.control{width:100%}.button{min-height:44px}}
body{padding:18px}.wrap{max-width:1180px;margin:auto}.head{margin-bottom:18px}.heat{display:grid;grid-template-columns:minmax(130px,1.3fr) repeat(4,minmax(110px,1fr));min-width:620px}.cell{min-height:46px;display:flex;align-items:center;justify-content:center;border-right:2px solid #fff;border-bottom:2px solid #fff;font-size:12px;font-weight:800}.cell.label{justify-content:flex-start;background:#f2eee7;padding-left:10px}.cell.head{background:#e8e6f6}.samples{margin-top:12px;padding:15px;display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.samples article{padding:15px;border:1px solid var(--line);border-radius:10px}.samples b{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.08em}.samples span{display:block;margin-top:10px;font-size:24px}.font-chip{display:inline-flex;padding:7px 10px;margin:4px;border:1px solid var(--line);border-radius:999px;font-size:11px}@media(max-width:680px){body{padding:10px}.samples{grid-template-columns:1fr 1fr}.samples span{font-size:19px}}</style></head><body><main class="wrap"><header class="head"><p class="eyebrow">Gambar 8</p><h1 class="visual-title">Peta Panas Distribusi Tipografi Sampul Buku</h1><p class="visual-sub">Distribusi kategori typeface per genre dilengkapi spesimen visual dan daftar font teratas.</p></header><div class="toolbar" style="margin-bottom:14px"><select id="genre" class="control"></select></div><div class="card" style="padding:15px;overflow:auto"><div id="heat" class="heat"></div></div><div class="samples card"><article><b>Serif</b><span style="font-family:Georgia,serif">Aa Sejarah dan Ingatan</span></article><article><b>Script</b><span style="font-family:'Comic Sans MS',cursive">Aa Surat dan Romansa</span></article><article><b>Sans-serif</b><span style="font-family:Arial,sans-serif">Aa Modern dan Langsung</span></article><article><b>Fancy</b><span style="font-family:Impact,fantasy">Aa Horor dan Eksperimen</span></article></div><div id="fonts" class="card" style="margin-top:12px;padding:15px"></div></main><script>fetch('../data/summary.json').then(r=>r.json()).then(S=>{const order=S.orders.typefaces;heat.innerHTML='<div class="cell head label">Genre</div>'+order.map(t=>`<div class="cell head">${t}</div>`).join('');S.orders.genres.forEach(g=>{heat.insertAdjacentHTML('beforeend',`<div class="cell label">${g}</div>`);order.forEach(t=>{const v=S.genres[g].typefaces[t],a=.12+.88*Math.min(1,v/70);heat.insertAdjacentHTML('beforeend',`<div class="cell" style="background:rgba(73,68,190,${a});color:${v>36?'white':'#171714'}">${v.toLocaleString('id-ID',{maximumFractionDigits:1})}%</div>`)});genre.add(new Option(g,g))});function show(){const g=genre.value||'Fiksi Sejarah';fonts.innerHTML='<b>Font teratas pada '+g+'</b><div style="margin-top:8px">'+S.genres[g].top_fonts.map(x=>`<span class="font-chip" style="font-family:${JSON.stringify(x.font)},sans-serif">${x.font} · ${x.pct.toLocaleString('id-ID',{maximumFractionDigits:1})}%</span>`).join('')+'</div>';reportHeight()}genre.value='Fiksi Sejarah';genre.onchange=show;show()})

function reportHeight(){try{parent.postMessage({type:'embed-height',height:Math.ceil(document.documentElement.scrollHeight)},'*')}catch(e){}}
addEventListener('load',()=>setTimeout(reportHeight,80));addEventListener('resize',()=>setTimeout(reportHeight,80));new ResizeObserver(()=>reportHeight()).observe(document.body);
</script></body></html>
