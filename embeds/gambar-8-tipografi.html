<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
:root{--paper:#f7f4ed;--ink:#191815;--muted:#716d65;--line:#d9d3c8;--accent:#914936;--panel:#fff;--serif:Georgia,"Times New Roman",serif;--sans:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;--shadow:0 18px 48px rgba(41,35,27,.08)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans)}a{color:inherit}button,input,select{font:inherit}.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}.eyebrow{margin:0 0 8px;color:var(--accent);font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase}.title{margin:0;font-family:var(--serif);font-weight:400;font-size:clamp(32px,5vw,58px);line-height:1.03;letter-spacing:-.04em}.sub{margin:10px 0 0;color:var(--muted);font-size:14px;line-height:1.6}.control{border:1px solid var(--line);border-radius:10px;background:#fff;padding:10px 12px;min-height:44px}.btn{border:1px solid var(--ink);background:var(--ink);color:#fff;border-radius:999px;padding:10px 15px;font-size:12px;font-weight:800;cursor:pointer}.btn.light{background:#fff;color:var(--ink);border-color:var(--line)}
html,body{height:100%;overflow:hidden}body{display:grid;place-items:center;padding:10px;background:#fff}figure{margin:0;width:100%;height:100%;display:grid;grid-template-rows:1fr auto;gap:8px}img{width:100%;height:100%;object-fit:contain;display:block}figcaption{text-align:center;font-size:12px;font-weight:700}</style></head><body><figure><img src="../assets/figures/gambar-8.png" alt="Peta Panas Tipografi"><figcaption>Peta Panas Tipografi</figcaption></figure><script>function reportHeight(){try{parent.postMessage({type:'embed-height',height:Math.ceil(document.documentElement.scrollHeight)},'*')}catch(e){}}addEventListener('load',()=>setTimeout(reportHeight,80));addEventListener('resize',()=>setTimeout(reportHeight,80));new ResizeObserver(()=>reportHeight()).observe(document.body);</script></body></html>
