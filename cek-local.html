<!doctype html><html lang="id"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cek Local</title><style>body{font:15px system-ui;max-width:900px;margin:40px auto;padding:20px}iframe{width:100%;height:520px;border:1px solid #ddd;margin:12px 0 28px}code{background:#eee;padding:3px 6px}.ok{color:green}.bad{color:#b00}</style><h1>Cek localhost</h1><p id="status">Memeriksa data…</p><h2>Gambar 1</h2><iframe src="./embeds/gambar-1-mosaik.html?embed=1"></iframe><h2>Gambar 3</h2><iframe src="./embeds/gambar-3-dashboard.html?embed=1"></iframe><script>Promise.all(['./data/books.min.json','./data/summary.json'].map(x=>fetch(x).then(r=>{if(!r.ok)throw Error(x+' '+r.status);return r.json()}))).then(()=>status.innerHTML='<span class=ok>✓ Data dan jalur lokal berfungsi.</span>').catch(e=>status.innerHTML='<span class=bad>✕ '+e.message+'</span><br>Pastikan server dijalankan dari folder utama proyek.')</script></html>
